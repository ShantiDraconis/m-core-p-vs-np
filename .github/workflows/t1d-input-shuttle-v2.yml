name: T1D Input Shuttle V2

on:
  push:
    branches:
      - attack/t1d-input-shuttle-v2-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  input-shuttle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Hygiene
        run: |
          set -euo pipefail
          f=lean/MCore/Real/P01FullVerifierInputShuttleV2.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"
      - name: Build
        run: lake build MCore.Real.P01FullVerifierInputShuttleV2
      - name: Axiom audit
        run: |
          cat >/tmp/T1DInputShuttleAudit.lean <<'EOF'
          import MCore.Real.P01FullVerifierInputShuttleV2
          #print axioms MCore.Real.P01FullVerifierInputShuttleV2.moveToWitnessSeqV2_head_correct
          #print axioms MCore.Real.P01FullVerifierInputShuttleV2.witness_roundTripV2_length
          EOF
          lake env lean /tmp/T1DInputShuttleAudit.lean 2>&1 | tee /tmp/audit.log
          ! grep -q 'sorryAx' /tmp/audit.log
