name: T1D Stack Primitive Machine

on:
  push:
    branches:
      - attack/t1d-stack-primitive-machine-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stack-machine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Hygiene
        run: |
          set -euo pipefail
          f=lean/MCore/Real/P01FullVerifierStackPrimitiveMachine.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"
      - name: Build
        run: lake build MCore.Real.P01FullVerifierStackPrimitiveMachine
      - name: Axiom audit
        run: |
          cat >/tmp/T1DStackMachineAudit.lean <<'EOF'
          import MCore.Real.P01FullVerifierStackPrimitiveMachine
          #print axioms MCore.Real.P01FullVerifierStackPrimitiveMachine.push_run_one_rep
          #print axioms MCore.Real.P01FullVerifierStackPrimitiveMachine.pop_run_two_false
          #print axioms MCore.Real.P01FullVerifierStackPrimitiveMachine.pop_run_two_true
          EOF
          lake env lean /tmp/T1DStackMachineAudit.lean 2>&1 | tee /tmp/audit.log
          ! grep -q 'sorryAx' /tmp/audit.log
