name: ATK P01 encoded evaluator

on:
  push:
    branches:
      - atk/next-p01-integrated-machine-20260929
      - atk/p01-frame-pop-read-20260929
      - atk/p01-eval-cursor-20260929
    paths:
      - 'lean/MCore/Real/P01EncodedEvaluator.lean'
      - 'lean/MCore/Real/P01EncodedStackEvaluator.lean'
      - 'lean/MCore/Real/P01EncodedFrameTape.lean'
      - 'lean/MCore/Real/P01EvalFramePushMachine.lean'
      - 'lean/MCore/Real/P01EvalFramePopMachine.lean'
      - 'lean/MCore/Real/P01EvalCursorMachine.lean'
      - '.github/workflows/p01-encoded-evaluator.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Kernel build encoded evaluator
        run: |
          lake build MCore.Real.P01EncodedEvaluator
          lake build MCore.Real.P01EncodedStackEvaluator
          lake build MCore.Real.P01EncodedFrameTape
          lake build MCore.Real.P01EvalFramePushMachine
          lake build MCore.Real.P01EvalFramePopMachine
          lake build MCore.Real.P01EvalCursorMachine
      - name: Axiom audit
        run: |
          cat > P01EncodedEvaluatorAxiomAudit.lean <<'EOF'
          import MCore.Real.P01EncodedEvaluator
          import MCore.Real.P01EncodedStackEvaluator
          import MCore.Real.P01EncodedFrameTape
          import MCore.Real.P01EvalFramePushMachine
          import MCore.Real.P01EvalFramePopMachine
          import MCore.Real.P01EvalCursorMachine
          #print axioms MCore.Real.P01EncodedEvaluator.evalEncodedCore_encode_append
          #print axioms MCore.Real.P01EncodedEvaluator.evalEncoded_encode
          #print axioms MCore.Real.P01EncodedStackEvaluator.evalRun_encode_append
          #print axioms MCore.Real.P01EncodedStackEvaluator.evalStepCount_le_three_mul_encoding
          #print axioms MCore.Real.P01EncodedStackEvaluator.evalRun_encode_bounded
          #print axioms MCore.Real.P01EncodedFrameTape.decodeEvalFrame_encodeEvalFrame
          #print axioms MCore.Real.P01EncodedFrameTape.decodeEvalFrames_encodeEvalFrames
          #print axioms MCore.Real.P01EvalFramePushMachine.framePush_run_three
          #print axioms MCore.Real.P01EvalFramePushMachine.framePush_rejects_nonblank
          #print axioms MCore.Real.P01EvalFramePopMachine.framePop_run_four
          #print axioms MCore.Real.P01EvalFramePopMachine.framePop_run_four_rep
          #print axioms MCore.Real.P01EvalFramePopMachine.framePop_rejects_111
          #print axioms MCore.Real.P01EvalCursorMachine.cursorSeek_run
          EOF
          lake env lean P01EncodedEvaluatorAxiomAudit.lean | tee P01EncodedEvaluatorAxiomAudit.log
          if grep -F 'sorryAx' P01EncodedEvaluatorAxiomAudit.log; then exit 1; fi
      - name: Reject proof escapes
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(sorry|axiom|admit)[[:space:]]' lean/MCore/Real/P01EncodedEvaluator.lean lean/MCore/Real/P01EncodedStackEvaluator.lean lean/MCore/Real/P01EncodedFrameTape.lean lean/MCore/Real/P01EvalFramePushMachine.lean lean/MCore/Real/P01EvalFramePopMachine.lean lean/MCore/Real/P01EvalCursorMachine.lean; then
            echo "proof escape found"
            exit 1
          fi
