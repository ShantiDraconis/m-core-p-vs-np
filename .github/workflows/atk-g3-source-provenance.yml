name: ATK G3 source provenance

on:
  push:
    branches:
      - attack/p01-hard-realization-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  g3-source-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Hygiene
        run: |
          set -euo pipefail
          file=lean/MCore/Real/OfficialCookSource.lean
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then exit 1; fi
          if grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$file"; then exit 1; fi
          if grep -nE '(^|[^[:alnum:]_])partial([^[:alnum:]_]|$)' "$file"; then exit 1; fi

      - name: Build source record
        run: |
          set -euo pipefail
          lake build MCore.Real.OfficialCookSource

      - name: Axiom audit
        run: |
          set -euo pipefail
          cat >/tmp/G3SourceAudit.lean <<'EOF'
          import MCore.Real.OfficialCookSource
          #print axioms MCore.Real.OfficialCookSource.cookCMISource_is_populated
          EOF
          lake env lean /tmp/G3SourceAudit.lean 2>&1 | tee /tmp/g3-source.log
          if grep -q 'sorryAx' /tmp/g3-source.log; then exit 1; fi

      - name: Preserve model-match boundary
        run: |
          set -euo pipefail
          echo "G3_SOURCE_PROVENANCE=GREEN_IF_JOB_SUCCEEDS"
          echo "G3_EXTERNAL_MODEL=OPEN"
          echo "G3_MODEL_MATCH=OPEN"
