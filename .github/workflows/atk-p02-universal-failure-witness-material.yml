name: ATK P02 Universal Failure Witness Material

on:
  push:
    branches:
      - atk/p02-g2-universal-failure-material-20261005
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        uses: leanprover/lean-action@v1
      - name: Build material witness frontier
        run: |
          set -euo pipefail
          lake build MCore.Real.P02UniversalFailureWitnessMaterial
      - name: Axiom and placeholder audit
        run: |
          set -euo pipefail
          cat > P02UniversalFailureWitnessAudit.lean <<'EOF'
          import MCore.Real.P02UniversalFailureWitnessMaterial
          #print axioms MCore.Real.P02UniversalFailureWitnessMaterial.UniversalFailureWitness.toFailureGenerator
          #print axioms MCore.Real.P02UniversalFailureWitnessMaterial.witness_implies_universalFailure
          #print axioms MCore.Real.P02UniversalFailureWitnessMaterial.witness_implies_notInP
          #print axioms MCore.Real.P02UniversalFailureWitnessMaterial.witness_implies_p_ne_np
          #print axioms MCore.Real.P02UniversalFailureWitnessMaterial.witness_iff_universalFailure
          EOF
          lake env lean P02UniversalFailureWitnessAudit.lean 2>&1 | tee /tmp/p02-ufw-axioms.log
          if grep -E 'sorryAx' /tmp/p02-ufw-axioms.log; then exit 1; fi
          if grep -En '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' lean/MCore/Real/P02UniversalFailureWitnessMaterial.lean; then exit 1; fi
          echo P02_UNIVERSAL_FAILURE_WITNESS_FRONTIER_GREEN
