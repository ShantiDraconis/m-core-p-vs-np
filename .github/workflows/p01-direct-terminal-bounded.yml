name: P01 Direct Terminal Bounded

on:
  push:
    branches:
      - atk/direct-p01-terminal-close-v2-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
          $HOME/.elan/bin/elan default "$(cat lean-toolchain)"

      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update

      - name: Build bounded terminal modules
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.Real.P01CheckedEvalRunBoundedHelpers
          lake build MCore.Real.P01CheckedEvalRunBoundedConst
          lake build MCore.Real.P01CheckedEvalRunBoundedCertificate
          lake build MCore.Real.P01DirectVerifierInhabitant

      - name: Placeholder firewall
        run: |
          set -euo pipefail
          for FILE in             lean/MCore/Real/P01CheckedEvalRunBoundedHelpers.lean             lean/MCore/Real/P01CheckedEvalRunBoundedConst.lean             lean/MCore/Real/P01CheckedEvalRunBoundedCertificate.lean             lean/MCore/Real/P01DirectVerifierInhabitant.lean
          do
            ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$FILE"
          done
