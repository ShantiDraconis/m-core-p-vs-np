name: P01 Direct Inhabitant

on:
  push:
    branches:
      - atk/p01-direct-inhabitant-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  direct-inhabitant:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
          $HOME/.elan/bin/elan default "$(cat lean-toolchain)"

      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
          lake exe cache get || true

      - name: Direct verifier proof
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.Real.P01DirectVerifierInhabitant

      - name: Placeholder firewall
        run: |
          set -euo pipefail
          FILE=lean/MCore/Real/P01DirectVerifierInhabitant.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' "$FILE"

      - name: Axiom audit
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cat > P01DirectAxioms.lean <<'EOF'
          import MCore.Real.P01DirectVerifierInhabitant
          #print axioms MCore.Real.P01DirectVerifierInhabitant.circuit_reject_certificate
          #print axioms MCore.Real.P01DirectVerifierInhabitant.prepared_canonical_reaches_reject
          #print axioms MCore.Real.P01DirectVerifierInhabitant.prepared_canonical_halts_exists
          EOF
          lake env lean P01DirectAxioms.lean | tee /tmp/p01-direct-axioms.log
          ! grep -F 'sorryAx' /tmp/p01-direct-axioms.log
