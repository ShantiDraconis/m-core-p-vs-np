name: ATK External Terminal Producer Miner v1

on:
  push:
    branches:
      - "atk/external-terminal-producer-miner-v1"
  workflow_dispatch:

jobs:
  mine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch all historical branches
        run: git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
      - name: Mine no-hypothesis terminal producers
        run: python3 scripts/terminal_producer_miner.py
      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: terminal-producer-miner-v1
          path: |
            evidence/terminal_producer_miner.json
            evidence/terminal_producer_summary.txt
