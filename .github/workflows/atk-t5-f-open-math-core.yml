name: ATK t5-f open math core
on:
  push:
    branches:
      - atk/t5-f-total-semantic-counterexample-20260922
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update

      - name: Build open math layers
        run: |
          lake build MCore.Real.OpenMathCore.Arithmetic
          lake build MCore.Real.OpenMathCore.Algebra
          lake build MCore.Real.OpenMathCore.NumericClasses
          lake build MCore.Real.OpenMathCore.Topology
          lake build MCore.Real.OpenMathCore.Calculus
          lake build MCore.Real.OpenMathCore.Behavior
          lake build MCore.Real.OpenMathCore.T5FBridge
          lake build MCore.Real.OpenMathCore.Foundation
          lake build MCore.Real.OpenMathCore.Semantics
          lake build MCore.Real.OpenMathCore.ReductionBarrier
          lake build MCore.Real.OpenMathCore.Invariants
          lake build MCore.Real.OpenMathCore.Asymptotic
          lake build MCore.Real.OpenMathCore.Functoriality
          lake build MCore.Real.OpenMathCore.Stability
          lake build MCore.Real.OpenMathUniversalSeparationLaw
          lake build MCore.Real.OpenMathCore.SelfQuotation
          lake build MCore.Real.OpenMathCore.BoundedUniversalSimulation
          lake build MCore.Real.OpenMathCore.SATCircuitCompiler
          lake build MCore.Real.OpenMathCore.SameInputClosure
          lake build MCore.Real.OpenMathCore.TerminalArchitecture

      - name: Hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean/MCore/Real/OpenMathCore lean/MCore/Real/OpenMathUniversalSeparationLaw.lean; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' --include='*.lean' lean/MCore/Real/OpenMathCore lean/MCore/Real/OpenMathUniversalSeparationLaw.lean; then exit 1; fi

      - name: Fail closed endpoint
        run: echo "OPEN_MATH_TERMINAL=Nonempty TotalCandidateSeparationLaw"
