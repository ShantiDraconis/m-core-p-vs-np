name: P02 Universal Failure Min-Cut

on:
  push:
    branches:
      - atk/p01-post-mincut-advance-20261001
    paths:
      - 'lean/MCore/Real/P02UniversalFailureMinCut.lean'
      - 'lean/MCore/Real/P02ExplicitClockNormalForm.lean'
      - 'lean/MCore/Real/P02FailureNormalForms.lean'
      - 'lean/MCore/Real/P02TotalCandidateSemanticCore.lean'
      - 'lean/MCore/Real/P02SemanticTransformerCore.lean lean/MCore/Real/P02CookLevinSameInputCore.lean'
      - 'lean/MCore/Real/P02CookLevinSameInputCore.lean'
      - 'lean/MCore/Real/P02SemanticFlipCore.lean'
      - 'lean/MCore/Real/P02ComplementTableauDiagonal.lean'
      - 'audit/ATK_P02_TOTAL_CANDIDATE_SEMANTIC_CORE_V1.json'
      - 'audit/ATK_P02_FAILURE_NORMAL_FORM_V1.json'
      - 'audit/ATK_P02_KLEENE_PORT_COMPAT_V1.json'
      - '.github/workflows/p02-universal-failure-mincut.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mincut:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
          $HOME/.elan/bin/elan default "$(cat lean-toolchain)"
      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Build P02 min-cut
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.Real.P02UniversalFailureMinCut
          lake build MCore.Real.P02ExplicitClockNormalForm
          lake build MCore.Real.P02FailureNormalForms
          lake build MCore.Real.P02TotalCandidateSemanticCore
          lake build MCore.Real.P02SemanticTransformerCore
          lake build MCore.Real.P02CookLevinSameInputCore
          lake build MCore.Real.P02SemanticFlipCore
          lake build MCore.Real.P02ComplementTableauDiagonal
      - name: Exact axiom audit
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cat > P02UniversalFailureAudit.lean <<'EOF'
          import MCore.Real.P02UniversalFailureMinCut
          import MCore.Real.P02ExplicitClockNormalForm
          import MCore.Real.P02FailureNormalForms
          import MCore.Real.P02TotalCandidateSemanticCore
          import MCore.Real.P02SemanticTransformerCore
          import MCore.Real.P02CookLevinSameInputCore
          import MCore.Real.P02SemanticFlipCore
          import MCore.Real.P02ComplementTableauDiagonal
          #print axioms MCore.Real.P02UniversalFailureMinCut.failureMode_iff_not_correctAt
          #print axioms MCore.Real.P02UniversalFailureMinCut.producer_implies_universal_failure
          #print axioms MCore.Real.P02UniversalFailureMinCut.producer_iff_universal_failure
          #print axioms MCore.Real.P02UniversalFailureMinCut.producer_closes_internal_endpoint
          #print axioms MCore.Real.P02ExplicitClockNormalForm.timeBound_le_polynomialEnvelope
          #print axioms MCore.Real.P02ExplicitClockNormalForm.run_at_envelope_eq_of_halts
          #print axioms MCore.Real.P02ExplicitClockNormalForm.normalized_correctAt_of_correctAt
          #print axioms MCore.Real.P02ExplicitClockNormalForm.original_failure_of_normalized_failure
          #print axioms MCore.Real.P02ExplicitClockNormalForm.explicit_clock_producer_implies_universal_failure
          #print axioms MCore.Real.P02FailureNormalForms.semanticDisagreement_iff_not_semantic_correct
          #print axioms MCore.Real.P02FailureNormalForms.normalizedFailure_iff_not_correctAt
          #print axioms MCore.Real.P02FailureNormalForms.NormalizedCounterexampleProducer.toFailureGenerator
          #print axioms MCore.Real.P02FailureNormalForms.normalizedProducer_iff_universal_failure
          #print axioms MCore.Real.P02FailureNormalForms.normalizedProducer_closes_internal_endpoint
          #print axioms MCore.Real.P02TotalCandidateSemanticCore.exists_timeout_of_not_total
          #print axioms MCore.Real.P02TotalCandidateSemanticCore.candidate_failure_of_total_semantic
          #print axioms MCore.Real.P02TotalCandidateSemanticCore.total_semantic_core_iff_universal_failure
          #print axioms MCore.Real.P02TotalCandidateSemanticCore.total_semantic_core_closes_internal_endpoint
          #print axioms MCore.Real.P02SemanticTransformerCore.semanticNegationBits_valid
          #print axioms MCore.Real.P02SemanticTransformerCore.semanticNegationBits_flip
          #print axioms MCore.Real.P02SemanticTransformerCore.transformed_output_fails_semantically
          #print axioms MCore.Real.P02SemanticTransformerCore.semantic_alignment_core_implies_universal_failure
          #print axioms MCore.Real.P02CookLevinSameInputCore.rejectTransform_sat_iff_not_accepts
          #print axioms MCore.Real.P02CookLevinSameInputCore.SameInputWitness.semanticFlip
          #print axioms MCore.Real.P02CookLevinSameInputCore.sameInputCore_implies_semanticFlipCore
          #print axioms MCore.Real.P02CookLevinSameInputCore.sameInputCore_implies_universal_failure
          #print axioms MCore.Real.P02SemanticFlipCore.semanticFlip_iff_semanticDisagreement
          #print axioms MCore.Real.P02SemanticFlipCore.semantic_flip_core_iff_total_semantic_core
          #print axioms MCore.Real.P02SemanticFlipCore.semantic_flip_core_iff_universal_failure
          #print axioms MCore.Real.P02SemanticFlipCore.semantic_flip_core_closes_internal_endpoint
          #print axioms MCore.Real.P02ComplementTableauDiagonal.complement_acceptsAtFuel_iff_not
          #print axioms MCore.Real.P02ComplementTableauDiagonal.diagonalBits_sat_iff_not_declaredAccepts
          #print axioms MCore.Real.P02ComplementTableauDiagonal.semanticFlip_diagonalBits_of_alignment
          #print axioms MCore.Real.P02ComplementTableauDiagonal.alignment_core_implies_semantic_flip_core
          #print axioms MCore.Real.P02ComplementTableauDiagonal.alignment_core_implies_universal_failure
          EOF
          lake env lean P02UniversalFailureAudit.lean | tee P02UniversalFailureAudit.log
          ! grep -E 'sorryAx' P02UniversalFailureAudit.log
      - name: Placeholder firewall
        run: |
          set -euo pipefail
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' lean/MCore/Real/P02UniversalFailureMinCut.lean lean/MCore/Real/P02ExplicitClockNormalForm.lean lean/MCore/Real/P02FailureNormalForms.lean lean/MCore/Real/P02TotalCandidateSemanticCore.lean lean/MCore/Real/P02SemanticTransformerCore.lean lean/MCore/Real/P02SemanticFlipCore.lean
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/Real/P02UniversalFailureMinCut.lean lean/MCore/Real/P02ExplicitClockNormalForm.lean lean/MCore/Real/P02FailureNormalForms.lean lean/MCore/Real/P02TotalCandidateSemanticCore.lean
