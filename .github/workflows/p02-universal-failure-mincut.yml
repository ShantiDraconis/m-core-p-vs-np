name: P02 Universal Failure Min-Cut

on:
  push:
    branches:
      - atk/p01-post-mincut-advance-20261001
    paths:
      - 'lean/MCore/Real/P02UniversalFailureMinCut.lean'
      - 'lean/MCore/Real/P02ExplicitClockNormalForm.lean'
      - 'lean/MCore/Real/P02FiniteDescriptorReduction.lean'
      - 'lean/MCore/Real/P02FiniteDescriptorResidualCore.lean'
      - 'lean/MCore/Real/P02FiniteDescriptorStructuralLaws.lean'
      - 'lean/MCore/Real/P02FiniteDescriptorInfiniteOrbit.lean'
      - 'lean/MCore/Real/P02FiniteDescriptorOrbitResidual.lean'
      - 'lean/MCore/Real/P02FiniteDescriptorAlternation.lean'
      - 'lean/MCore/Real/P02FailureNormalForms.lean'
      - 'lean/MCore/Real/P02TotalCandidateSemanticCore.lean'
      - 'lean/MCore/Real/P02SemanticTransformerCore.lean'
      - 'lean/MCore/Real/P02SemanticTransformerDichotomy.lean'
      - 'lean/MCore/Real/P02SemanticFlipCore.lean'
      - 'lean/MCore/Real/P02OpenMathRouteFalsification.lean'
      - 'lean/MCore/Real/P02ComplementTableauDiagonal.lean'
      - 'lean/MCore/Real/P02DiagonalOrbitCore.lean'
      - 'lean/MCore/Real/P02SemanticAlignmentCountermodel.lean'
      - 'lean/MCore/Real/P02CookLevinSameInputCore.lean'
      - 'audit/ATK_P02_TOTAL_CANDIDATE_SEMANTIC_CORE_V1.json'
      - 'audit/ATK_P02_FAILURE_NORMAL_FORM_V1.json'
      - 'audit/ATK_P02_KLEENE_PORT_COMPAT_V1.json'
      - '.github/workflows/p02-universal-failure-mincut.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mincut:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
          $HOME/.elan/bin/elan default "$(cat lean-toolchain)"
      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Build P02 min-cut
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.Real.P02UniversalFailureMinCut
          lake build MCore.Real.P02ExplicitClockNormalForm
          lake build MCore.Real.P02FiniteDescriptorReduction
          lake build MCore.Real.P02FiniteDescriptorResidualCore
          lake build MCore.Real.P02FiniteDescriptorStructuralLaws
          lake build MCore.Real.P02FiniteDescriptorInfiniteOrbit
          lake build MCore.Real.P02FiniteDescriptorOrbitResidual
          lake build MCore.Real.P02FiniteDescriptorAlternation
          lake build MCore.Real.P02FailureNormalForms
          lake build MCore.Real.P02TotalCandidateSemanticCore
          lake build MCore.Real.P02SemanticTransformerCore
          lake build MCore.Real.P02SemanticTransformerDichotomy
          lake build MCore.Real.P02SemanticFlipCore
          lake build MCore.Real.P02OpenMathRouteFalsification
          lake build MCore.Real.P02ComplementTableauDiagonal
          lake build MCore.Real.P02DiagonalOrbitCore
          lake build MCore.Real.P02SemanticAlignmentCountermodel
          lake build MCore.Real.P02CookLevinSameInputCore
      - name: Exact axiom audit
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cat > P02UniversalFailureAudit.lean <<'EOF'
          import MCore.Real.P02UniversalFailureMinCut
          import MCore.Real.P02ExplicitClockNormalForm
          import MCore.Real.P02FiniteDescriptorReduction
          import MCore.Real.P02FiniteDescriptorResidualCore
          import MCore.Real.P02FiniteDescriptorStructuralLaws
          import MCore.Real.P02FiniteDescriptorInfiniteOrbit
          import MCore.Real.P02FiniteDescriptorOrbitResidual
          import MCore.Real.P02FiniteDescriptorAlternation
          import MCore.Real.P02FailureNormalForms
          import MCore.Real.P02TotalCandidateSemanticCore
          import MCore.Real.P02SemanticTransformerCore
          import MCore.Real.P02SemanticTransformerDichotomy
          import MCore.Real.P02SemanticFlipCore
          import MCore.Real.P02OpenMathRouteFalsification
          import MCore.Real.P02ComplementTableauDiagonal
          import MCore.Real.P02DiagonalOrbitCore
          import MCore.Real.P02SemanticAlignmentCountermodel
          import MCore.Real.P02CookLevinSameInputCore
          #print axioms MCore.Real.P02UniversalFailureMinCut.failureMode_iff_not_correctAt
          #print axioms MCore.Real.P02UniversalFailureMinCut.producer_implies_universal_failure
          #print axioms MCore.Real.P02UniversalFailureMinCut.producer_iff_universal_failure
          #print axioms MCore.Real.P02UniversalFailureMinCut.producer_closes_internal_endpoint
          #print axioms MCore.Real.P02ExplicitClockNormalForm.timeBound_le_polynomialEnvelope
          #print axioms MCore.Real.P02ExplicitClockNormalForm.run_at_envelope_eq_of_halts
          #print axioms MCore.Real.P02ExplicitClockNormalForm.normalized_correctAt_of_correctAt
          #print axioms MCore.Real.P02ExplicitClockNormalForm.original_failure_of_normalized_failure
          #print axioms MCore.Real.P02ExplicitClockNormalForm.explicit_clock_producer_implies_universal_failure
          #print axioms MCore.Real.P02FiniteDescriptorReduction.descriptorOf_toCandidate
          #print axioms MCore.Real.P02FiniteDescriptorReduction.finiteDescriptorFailure_iff_universalFailure
          #print axioms MCore.Real.P02FiniteDescriptorReduction.finiteDescriptorFailure_closes_internal_endpoint
          #print axioms MCore.Real.P02FiniteDescriptorResidualCore.failure_of_not_total
          #print axioms MCore.Real.P02FiniteDescriptorResidualCore.failure_of_not_constant_correct
          #print axioms MCore.Real.P02FiniteDescriptorResidualCore.residual_iff_finiteDescriptorFailure
          #print axioms MCore.Real.P02FiniteDescriptorResidualCore.residual_iff_universalFailure
          #print axioms MCore.Real.P02FiniteDescriptorOrbitResidual.orbitResidual_implies_residual
          #print axioms MCore.Real.P02FiniteDescriptorOrbitResidual.orbitResidual_iff_residual
          #print axioms MCore.Real.P02FiniteDescriptorOrbitResidual.orbitResidual_iff_universalFailure
          #print axioms MCore.Real.P02FiniteDescriptorAlternation.orbit_step_acceptance_flips
          #print axioms MCore.Real.P02FiniteDescriptorAlternation.residual_descriptor_has_two_alternating_orbits
          #print axioms MCore.Real.P02FiniteDescriptorAlternation.failure_of_nonalternating_step
          #print axioms MCore.Real.P02FailureNormalForms.semanticDisagreement_iff_not_semantic_correct
          #print axioms MCore.Real.P02FailureNormalForms.normalizedFailure_iff_not_correctAt
          #print axioms MCore.Real.P02FailureNormalForms.normalizedProducer_iff_universal_failure
          #print axioms MCore.Real.P02TotalCandidateSemanticCore.total_semantic_core_iff_universal_failure
          #print axioms MCore.Real.P02SemanticTransformerCore.semanticNegationBits_flip
          #print axioms MCore.Real.P02SemanticTransformerDichotomy.alignment_or_constantCorrectPattern
          #print axioms MCore.Real.P02SemanticTransformerDichotomy.constant_pattern_core_iff_universal_failure
          #print axioms MCore.Real.P02SemanticFlipCore.semantic_flip_core_iff_universal_failure
          #print axioms MCore.Real.P02ComplementTableauDiagonal.diagonalBits_sat_iff_not_declaredAccepts
          #print axioms MCore.Real.P02ComplementTableauDiagonal.alignment_core_implies_universal_failure
          #print axioms MCore.Real.P02DiagonalOrbitCore.orbit_residual_core_iff_universal_failure
          #print axioms MCore.Real.P02SemanticAlignmentCountermodel.constantPair_no_output_alignment
          #print axioms MCore.Real.P02SemanticAlignmentCountermodel.semanticAlignmentCore_refuted
          #print axioms MCore.Real.P02CookLevinSameInputCore.rejectTransform_sat_iff_not_accepts
          #print axioms MCore.Real.P02CookLevinSameInputCore.SameInputWitness.semanticFlip
          #print axioms MCore.Real.P02CookLevinSameInputCore.sameInputCore_implies_universal_failure
          #print axioms MCore.Real.P02FiniteDescriptorInfiniteOrbit.diagonalBits_strict_growth
          #print axioms MCore.Real.P02FiniteDescriptorInfiniteOrbit.orbit_length_strictMono
          #print axioms MCore.Real.P02FiniteDescriptorInfiniteOrbit.orbit_injective
          #print axioms MCore.Real.P02FiniteDescriptorInfiniteOrbit.infinite_alternating_certificate
          EOF
          lake env lean P02UniversalFailureAudit.lean | tee P02UniversalFailureAudit.log
          ! grep -E 'sorryAx' P02UniversalFailureAudit.log
      - name: Placeholder firewall
        run: |
          set -euo pipefail
          files="lean/MCore/Real/P02UniversalFailureMinCut.lean lean/MCore/Real/P02ExplicitClockNormalForm.lean lean/MCore/Real/P02FiniteDescriptorReduction.lean lean/MCore/Real/P02FiniteDescriptorResidualCore.lean lean/MCore/Real/P02FiniteDescriptorStructuralLaws.lean lean/MCore/Real/P02FiniteDescriptorOrbitResidual.lean lean/MCore/Real/P02FiniteDescriptorAlternation.lean lean/MCore/Real/P02FailureNormalForms.lean lean/MCore/Real/P02TotalCandidateSemanticCore.lean lean/MCore/Real/P02SemanticTransformerCore.lean lean/MCore/Real/P02SemanticTransformerDichotomy.lean lean/MCore/Real/P02SemanticFlipCore.lean lean/MCore/Real/P02OpenMathRouteFalsification.lean lean/MCore/Real/P02ComplementTableauDiagonal.lean lean/MCore/Real/P02DiagonalOrbitCore.lean lean/MCore/Real/P02SemanticAlignmentCountermodel.lean lean/MCore/Real/P02CookLevinSameInputCore.lean"
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' $files
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' $files
