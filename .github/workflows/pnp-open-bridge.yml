name: pnp-open-bridge

on:
  push:
    branches: [audit/multistate-proof-refutation-v1]
    paths:
      - 'audit/OfficialModel/**'
      - 'audit/C12/**'
      - 'audit/SAT/**'
      - '.github/workflows/pnp-open-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  f1-sk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Resolve dependencies
        run: lake update

      - name: F1 operational TM model
        run: |
          set -euo pipefail
          lake env lean audit/OfficialModel/OperationalTM.lean 2>&1 | tee /tmp/f1-operational.log
          cat audit/OfficialModel/OperationalTM.lean audit/OfficialModel/F1_OfficialModelMatch.lean > /tmp/F1Combined.lean
          lake env lean /tmp/F1Combined.lean 2>&1 | tee /tmp/f1-match.log
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' audit/OfficialModel --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' audit/OfficialModel --include='*.lean'; then exit 1; fi
          if grep -E 'sorryAx' /tmp/f1-operational.log /tmp/f1-match.log; then exit 1; fi

      - name: F2 fixed-universe witness boundary
        run: |
          set -euo pipefail
          cat audit/OfficialModel/OperationalTM.lean > /tmp/F2Combined.lean
          cat audit/OfficialModel/F2_FixedWitness.lean >> /tmp/F2Combined.lean
          lake env lean /tmp/F2Combined.lean 2>&1 | tee /tmp/f2-fixed.log
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' audit/OfficialModel/F2_FixedWitness.lean; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' audit/OfficialModel/F2_FixedWitness.lean; then exit 1; fi
          if grep -E 'sorryAx|Classical\.choice' /tmp/f2-fixed.log; then exit 1; fi

      - name: SAT semantic core and explicit boundaries
        run: |
          set -euo pipefail
          lake env lean audit/SAT/SATCore.lean 2>&1 | tee /tmp/sat-core.log
          cat audit/OfficialModel/OperationalTM.lean > /tmp/SATCombined.lean
          grep -v '^import ' audit/SAT/SATCore.lean >> /tmp/SATCombined.lean
          cat audit/SAT/SATBoundary.lean >> /tmp/SATCombined.lean
          lake env lean /tmp/SATCombined.lean 2>&1 | tee /tmp/sat-boundary.log
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' audit/SAT --include='*.lean'; then exit 1; fi
          if grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' audit/SAT --include='*.lean'; then exit 1; fi
          if grep -E 'sorryAx|Classical\.choice' /tmp/sat-core.log /tmp/sat-boundary.log; then exit 1; fi

      - name: C12 rational-weight audit layer
        run: |
          set -euo pipefail
          lake env lean audit/C12/C12_Calibration.lean 2>&1 | tee /tmp/c12-calibration.log
          if grep -E 'sorryAx' /tmp/c12-calibration.log; then exit 1; fi

      - name: Refute direct syntactic-potential identification
        run: |
          set -euo pipefail
          lake env lean audit/C12/SRepresentationCounterexample.lean 2>&1 | tee /tmp/c12-s-counterexample.log
          if grep -E 'sorryAx|Classical\.choice' /tmp/c12-s-counterexample.log; then exit 1; fi
          grep -F "'Audit.C12Calibration.direct_potential_semantic_identification_refuted' depends on axioms:" /tmp/c12-s-counterexample.log || \
            grep -F "'Audit.C12Calibration.direct_potential_semantic_identification_refuted' does not depend on any axioms" /tmp/c12-s-counterexample.log

      - name: Generate C12 and C13 data
        run: |
          set -euo pipefail
          lake build c12_gen
          lake exe c12_gen > /tmp/c12.csv
          lake env lean --run audit/C12/C13Probe.lean > /tmp/c13.csv
          test "$(wc -l < /tmp/c12.csv)" -gt 100
          test "$(wc -l < /tmp/c13.csv)" -gt 100

      - name: Calibrate S K
        run: |
          set -euo pipefail
          python3 audit/C12/calibrate_sk.py audit/C12/C12_SK.generated.json /tmp/c12.csv /tmp/c13.csv
          python3 -m json.tool audit/C12/C12_SK.generated.json >/dev/null
          grep -q '"scientific_promotion": "NONE"' audit/C12/C12_SK.generated.json

      - name: Preserve 8x5 no-promotion contract
        run: |
          set -euo pipefail
          grep -q '"emit_closed_closed_closed": false' audit/8x5/PNP_8x5_STATE.json
          grep -q '"A": "PENDING"' audit/8x5/PNP_8x5_STATE.json
          echo 'OPEN_BRIDGE_RESEARCH_ONLY=PASS'

      - name: Upload calibration
        uses: actions/upload-artifact@v4
        with:
          name: pnp-f1-c12-calibration
          path: |
            audit/C12/C12_SK.generated.json
            /tmp/c12.csv
            /tmp/c13.csv
