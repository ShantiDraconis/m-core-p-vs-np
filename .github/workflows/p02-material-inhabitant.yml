name: P02 Material Inhabitant

on:
  push:
    branches:
      - atk/p02-material-inhabitant-20261007
  workflow_dispatch:

concurrency:
  group: p02-material-inhabitant-${{ github.ref }}
  cancel-in-progress: true

jobs:
  material-inhabitant:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
          use-mathlib-cache: false

      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update
          lake exe cache get || true

      - name: Kernel-check material inhabitant boundary
        shell: bash
        run: |
          set -euo pipefail
          lake build MCore.Real.P01FinalCertificate MCore.Real.P01WitnessIndexedReadGlobal MCore.Real.P01WitnessPrepGlobal MCore.Real.P01VerifierPhaseMinCutStructural MCore.Real.PNPMaterialInhabitant MCore.Real.PNPMaterialNPFrontier MCore.Real.PNPMaterialVerifierFrontier MCore.Real.P01RawTotalizationProducer MCore.Real.PNPMaterialNPClosed MCore.Real.PNPPromotedByMaterial 2>&1 | tee PNPMaterialBuild.log
          lake env lean lean/MCore/Real/PNPMaterialInhabitant.lean 2>&1 | tee PNPMaterialInhabitant.log
          lake env lean lean/MCore/Real/PNPMaterialNPFrontier.lean 2>&1 | tee PNPMaterialNPFrontier.log
          lake env lean lean/MCore/Real/PNPMaterialVerifierFrontier.lean 2>&1 | tee PNPMaterialVerifierFrontier.log
          lake env lean lean/MCore/Real/PNPMaterialNPClosed.lean 2>&1 | tee PNPMaterialNPClosed.log
          lake env lean lean/MCore/Real/PNPPromotedByMaterial.lean 2>&1 | tee PNPPromotedByMaterial.log
          if grep -E 'sorryAx|declaration uses .*sorry|unsolved goals' PNPMaterialBuild.log PNPMaterialInhabitant.log PNPMaterialNPFrontier.log PNPMaterialVerifierFrontier.log PNPMaterialNPClosed.log PNPPromotedByMaterial.log; then
            echo "Forbidden proof residue detected"
            exit 1
          fi

      - name: Certificate summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "CANONICAL_LANGUAGE=SATBits(circuitBitEncoding)"
            echo "MATERIAL_TYPE=InNP(SAT) AND NOT InP(SAT)"
            echo "OPERATIONAL_EQUIV=InNP(SAT) AND UniversalFailure(SAT)"
            echo "TRANSPORT_TO_PNEQNP=KERNEL_CHECKED_IF_BUILD_GREEN"
            echo "INDEXED_WITNESS_READ=CLOSED_KERNEL_TARGET"
            echo "NP_SIDE=CANONICAL_SAT_IN_NP_MATERIAL_TARGET"
            echo "REMAINING_MATERIAL_FRONTIER=CanonicalSATLowerBoundProducer"
            echo "PROMOTED_BY_MATERIAL=OPEN_MATH_UNTIL_CLOSED_TERM_EXISTS"
            echo "MATERIAL_PRODUCER=OPEN_MATH"
          } | tee PNPMaterialInhabitantCertificate.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-material-inhabitant-evidence
          path: |
            PNPMaterialBuild.log
            PNPMaterialInhabitant.log
            PNPMaterialNPFrontier.log
            PNPMaterialVerifierFrontier.log
            PNPMaterialNPClosed.log
            PNPPromotedByMaterial.log
            PNPMaterialInhabitantCertificate.txt
