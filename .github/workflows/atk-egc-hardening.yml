name: ATK EGC Hardening Gate

on:
  push:
    branches:
      - atk/egc-hardening-v1-20260926
    paths:
      - 'lean/MCore/Hardening/**'
      - '.github/workflows/atk-egc-hardening.yml'
  workflow_dispatch:

jobs:
  hardening-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - MCore.Hardening.Base
          - MCore.Hardening.P01StatementFrozen
          - MCore.Hardening.SSEStatementFrozen
          - MCore.Hardening.SSEWitnessConstruction
          - MCore.Hardening.AuditTheorem
          - MCore.Hardening.ExternalGlobalCertificate
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: Build individual target
        working-directory: lean
        run: lake build ${{ matrix.target }}

  axiom-audit:
    runs-on: ubuntu-latest
    needs: hardening-gate
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          build: false
          test: false
          lint: false
      - name: SSE closure axiom audit
        working-directory: lean
        run: |
          cat >/tmp/HardeningAudit.lean <<'EOF'
          import MCore.Hardening.SSEWitnessConstruction
          #print axioms MCore.Hardening.SSEWitnessConstruction.construction_closes_p02
          EOF
          lake env lean /tmp/HardeningAudit.lean | tee /tmp/axioms.log
          if grep -Eiq 'sorryAx|admit' /tmp/axioms.log; then
            echo RED_UNSAFE_AXIOM
            exit 1
          fi
