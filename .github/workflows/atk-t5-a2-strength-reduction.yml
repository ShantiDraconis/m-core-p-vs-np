name: ATK T5 A2 strength reduction

on:
  push:
    branches:
      - attack/t5-a2-strength-reduction-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t5-a2-strength:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Hygiene
        run: |
          set -euo pipefail
          f=lean/MCore/Real/P02T5A2StrengthReduction.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"
      - name: Build
        run: lake build MCore.Real.P02T5A2StrengthReduction
      - name: Axiom audit
        run: |
          cat >/tmp/T5A2StrengthAudit.lean <<'EOF'
          import MCore.Real.P02T5A2StrengthReduction
          #print axioms MCore.Real.P02T5A2StrengthReduction.universal_witness_implies_g21_pointwise
          EOF
          lake env lean /tmp/T5A2StrengthAudit.lean 2>&1 | tee /tmp/audit.log
          ! grep -q 'sorryAx' /tmp/audit.log
      - name: Status
        run: |
          echo "T5_A2_UNIVERSAL_WITNESS_TO_G21=PROVED"
          echo "T5_A2_EXISTENCE=OPEN_MATH"
