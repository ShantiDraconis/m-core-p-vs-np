name: P01 Verifier Phase Min-Cut Clean

on:
  push:
    branches:
      - atk/p01-verifier-phase-mincut-clean-20260930
    paths:
      - 'lean/MCore/Real/P01VerifierPhaseMinCutStructural.lean'
      - 'lean/MCore/Real/P01ManualStateCodecBase.lean'
      - 'lean/MCore/Real/P01ManualStateCodecComposite.lean'
      - 'lean/MCore/Real/P01CheckedVerifierManualFiniteState.lean'
      - 'lean/MCore/Real/P01CheckedVerifierGlobalCoreV2.lean'
      - 'lean/MCore/Real/P01ExactBoundedCircuitProducer.lean'
      - 'lean/MCore/Real/P01ExactBoundedReject.lean'
      - 'lean/MCore/Real/P01ExactVerifierGlobalBudget.lean'
      - 'lean/MCore/Real/P01ExactVerifierCanonicalRun.lean'
      - 'lean/MCore/Real/P01RawTotalizationMinCut.lean'
      - 'lean/MCore/Real/P01RawBaseExact.lean'
      - 'lean/MCore/Real/P01RawSourceSplit.lean'
      - 'lean/MCore/Real/P01RawDecodeFailureShape.lean'
      - 'lean/MCore/Real/P01RawDecodeFailureDescent.lean'
      - 'lean/MCore/Real/P01RawDecoderSound.lean'
      - 'lean/MCore/Real/P01RawDeadEnd.lean'
      - 'lean/MCore/Real/P01RawVerifierLift.lean'
      - 'lean/MCore/Real/P01RawMalformedTag.lean'
      - 'lean/MCore/Real/P01RawMalformedUnary.lean'
      - 'lean/MCore/Real/P01RawResidualReject.lean'
      - '.github/workflows/p01-verifier-phase-mincut-clean.yml'
      - 'lean/MCore/Real/P01WitnessPrepGlobal.lean'
      - 'lean/MCore/Real/P01IntegratedAssembly.lean'
      - 'lean-toolchain'
      - 'lakefile.lean'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mincut:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
          $HOME/.elan/bin/elan default "$(cat lean-toolchain)"
      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Build structural min-cut
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.Real.P01ManualStateCodecBase
          lake build MCore.Real.P01ManualStateCodecComposite
          lake build MCore.Real.P01CheckedVerifierManualFiniteState
          lake build MCore.Real.P01CheckedVerifierGlobalCoreV2
          lake build MCore.Real.P01ExactBoundedCircuitProducer
          lake build MCore.Real.P01ExactBoundedReject
          lake build MCore.Real.P01ExactVerifierGlobalBudget
          lake build MCore.Real.P01ExactVerifierCanonicalRun
          lake build MCore.Real.P01RawSourceSplit
          lake build MCore.Real.P01RawDecodeFailureShape
          lake build MCore.Real.P01RawDecodeFailureDescent
          lake build MCore.Real.P01RawDecoderSound
          lake build MCore.Real.P01RawDeadEnd
          lake build MCore.Real.P01RawVerifierLift
          lake build MCore.Real.P01RawMalformedTag
          lake build MCore.Real.P01RawMalformedUnary
          lake build MCore.Real.P01RawResidualReject
          lake build MCore.Real.P01RawTotalizationMinCut
          lake build MCore.Real.P01RawBaseExact
          lake build MCore.Real.P01VerifierPhaseMinCutStructural
      - name: Exact axiom audit
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          cat > P01VerifierPhaseMinCutAudit.lean <<'EOF'
          import MCore.Real.P01VerifierPhaseMinCutStructural
          import MCore.Real.P01CheckedVerifierManualFiniteState
          import MCore.Real.P01CheckedVerifierGlobalCoreV2
          import MCore.Real.P01ExactBoundedCircuitProducer
          import MCore.Real.P01ExactBoundedReject
          import MCore.Real.P01ExactVerifierGlobalBudget
          import MCore.Real.P01ExactVerifierCanonicalRun
          import MCore.Real.P01RawSourceSplit
          import MCore.Real.P01RawDecodeFailureShape
          import MCore.Real.P01RawDecodeFailureDescent
          import MCore.Real.P01RawDecoderSound
          import MCore.Real.P01RawDeadEnd
          import MCore.Real.P01RawVerifierLift
          import MCore.Real.P01RawMalformedTag
          import MCore.Real.P01RawMalformedUnary
          import MCore.Real.P01RawResidualReject
          import MCore.Real.P01RawTotalizationMinCut
          #print axioms MCore.Real.P01ManualStateCodecBase.inputNodeDecode_code
          #print axioms MCore.Real.P01ManualStateCodecComposite.checkedEvalDecode_code
          #print axioms MCore.Real.P01CheckedVerifierManualFiniteState.checkedVerifierStateDecode_encode
          #print axioms MCore.Real.P01CheckedVerifierManualFiniteState.checkedVerifierFinMachine_haltsWithin_iff
          #print axioms MCore.Real.P01CheckedVerifierManualFiniteState.checkedVerifierFinMachine_acceptsWithin_iff
          #print axioms MCore.Real.P01CheckedVerifierGlobalCoreV2.p01ConstructionGap_of_core
          #print axioms MCore.Real.P01CheckedVerifierGlobalCoreV2.mechanical_gap_closes_p01
          #print axioms MCore.Real.P01ExactBoundedCircuitProducer.circuit_exact_bounded_certificate
          #print axioms MCore.Real.P01ExactBoundedReject.circuit_exact_bounded_reject
          #print axioms MCore.Real.P01ExactVerifierGlobalBudget.checkedVerifierExactTimeBound_poly
          #print axioms MCore.Real.P01ExactVerifierCanonicalRun.prepared_canonical_halts_within_exact_global
          #print axioms MCore.Real.P01ExactVerifierCanonicalRun.prepared_canonical_accepts_iff_exact_global
          #print axioms MCore.Real.P01RawTotalizationMinCut.RawDecodeNoneFailClosed.toGlobalCore
          #print axioms MCore.Real.P01RawDecodeFailureShape.rawDecodeFailure_of_none
          #print axioms MCore.Real.P01RawDecodeFailureShape.decodeCircuit_none_has_failure
          #print axioms MCore.Real.P01RawDecodeFailureDescent.rawFailureChild_length_lt
          #print axioms MCore.Real.P01RawDecodeFailureDescent.decodeNat_none_replicate_true
          #print axioms MCore.Real.P01RawDecoderSound.decodeCircuitCore_success_sound
          #print axioms MCore.Real.P01RawDecoderSound.residual_is_canonical_prefix
          #print axioms MCore.Real.P01RawMalformedTag.prepared_truncated_tag_fail_closed
          #print axioms MCore.Real.P01RawMalformedUnary.prepared_truncated_unary_fail_closed
          #print axioms MCore.Real.P01RawResidualReject.canonical_prefix_with_residual_reaches_reject
          #print axioms MCore.Real.P01RawDeadEnd.haltsWithin_succ_of_reaches_dead
          #print axioms MCore.Real.P01RawDeadEnd.not_acceptsWithin_succ_of_reaches_dead
          #print axioms MCore.Real.P01RawTotalizationMinCut.raw_totalization_gap_closes_p01
          #print axioms MCore.Real.P01RawBaseExact.prepared_empty_fail_closed_exact
          #print axioms MCore.Real.P01RawBaseExact.prepared_truncated_tag_fail_closed_exact
          #print axioms MCore.Real.P01RawBaseExact.prepared_input_unary_none_fail_closed_exact
          #print axioms MCore.Real.P01RawBaseExact.prepared_invalid_terminal_tag_fail_closed_exact
          #print axioms MCore.Real.P01VerifierPhaseMinCutStructural.p01ConstructionGap_of_verifierPhase
          EOF
          lake env lean P01VerifierPhaseMinCutAudit.lean | tee P01VerifierPhaseMinCutAudit.log
          ! grep -E 'sorryAx' P01VerifierPhaseMinCutAudit.log
      - name: Placeholder firewall
        run: |
          set -euo pipefail
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' lean/MCore/Real/P01VerifierPhaseMinCutStructural.lean
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/Real/P01VerifierPhaseMinCutStructural.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit|sorryAx)([^[:alnum:]_]|$)' lean/MCore/Real/P01ManualStateCodecBase.lean lean/MCore/Real/P01ManualStateCodecComposite.lean lean/MCore/Real/P01CheckedVerifierManualFiniteState.lean lean/MCore/Real/P01CheckedVerifierGlobalCoreV2.lean lean/MCore/Real/P01RawBaseExact.lean
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/Real/P01ManualStateCodecBase.lean lean/MCore/Real/P01ManualStateCodecComposite.lean lean/MCore/Real/P01CheckedVerifierManualFiniteState.lean
