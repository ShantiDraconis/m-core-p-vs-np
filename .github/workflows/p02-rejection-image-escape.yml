name: P02 Rejection Image Escape
on:
  workflow_dispatch:

concurrency:
  group: p02-rejection-image-escape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image-escape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update

      - name: Build semantic dependency
        run: |
          set -euo pipefail
          lake build MCore.Real.P02SemanticSelfSubstitution

      - name: Build rejection image frontier
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02RejectionImageEscape.lean 2>&1 | tee P02RejectionImageEscape.log
          if grep -E 'sorryAx' P02RejectionImageEscape.log; then exit 1; fi

      - name: Build rejection image module
        run: |
          set -euo pipefail
          lake build MCore.Real.P02RejectionImageEscape

      - name: Build rejection image orbit
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02RejectionImageOrbit.lean 2>&1 | tee P02RejectionImageOrbit.log
          if grep -E 'sorryAx' P02RejectionImageOrbit.log; then exit 1; fi

      - name: Build active bridge closure
        run: |
          set -euo pipefail
          lake build MCore.Real.P02ActiveBridgeClosure 2>&1 | tee P02ActiveBridgeClosure.log
          if grep -E 'sorryAx' P02ActiveBridgeClosure.log; then exit 1; fi

      - name: Build finite clock normalization
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02FiniteClockNormalization.lean 2>&1 | tee P02FiniteClockNormalization.log
          if grep -E 'sorryAx' P02FiniteClockNormalization.log; then exit 1; fi

      - name: Build finite candidate description
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02FiniteCandidateDescription.lean 2>&1 | tee P02FiniteCandidateDescription.log
          if grep -E 'sorryAx' P02FiniteCandidateDescription.log; then exit 1; fi

      - name: Build diagonal no-shortcut
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02DiagonalNoShortcut.lean 2>&1 | tee P02DiagonalNoShortcut.log
          if grep -E 'sorryAx' P02DiagonalNoShortcut.log; then exit 1; fi

      - name: Build conditional final root
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02FinalRootConditional.lean 2>&1 | tee P02FinalRootConditional.log
          if grep -E 'sorryAx' P02FinalRootConditional.log; then exit 1; fi

      - name: Build terminal recurrence theorem
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02TerminalRecurrenceTheorem.lean 2>&1 | tee P02TerminalRecurrenceTheorem.log
          if grep -E 'sorryAx' P02TerminalRecurrenceTheorem.log; then exit 1; fi

      - name: Build terminal habitant cycle
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02TerminalHabitantCycle.lean 2>&1 | tee P02TerminalHabitantCycle.log
          if grep -E 'sorryAx' P02TerminalHabitantCycle.log; then exit 1; fi

      - name: Build terminal conjuncture nucleus
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02TerminalConjunctureNucleus.lean 2>&1 | tee P02TerminalConjunctureNucleus.log
          if grep -E 'sorryAx' P02TerminalConjunctureNucleus.log; then exit 1; fi

      - name: Build terminal three-way center
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02TerminalThreeWayCenter.lean 2>&1 | tee P02TerminalThreeWayCenter.log
          if grep -E 'sorryAx' P02TerminalThreeWayCenter.log; then exit 1; fi

      - name: Build terminal fraction convergence
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02TerminalFractionConvergence.lean 2>&1 | tee P02TerminalFractionConvergence.log
          if grep -E 'sorryAx' P02TerminalFractionConvergence.log; then exit 1; fi

      - name: Build open-closed duality
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02OpenClosedDuality.lean 2>&1 | tee P02OpenClosedDuality.log
          if grep -E 'sorryAx' P02OpenClosedDuality.log; then exit 1; fi

      - name: Build terminal self-difference collapse
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02OpenClosedIrreflexiveCollapse.lean 2>&1 | tee P02OpenClosedIrreflexiveCollapse.log
          if grep -E 'sorryAx' P02OpenClosedIrreflexiveCollapse.log; then exit 1; fi

      - name: Build open-to-closed collapse
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02OpenToClosedCollapse.lean 2>&1 | tee P02OpenToClosedCollapse.log
          if grep -E 'sorryAx' P02OpenToClosedCollapse.log; then exit 1; fi

      - name: Build user final closure probe
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02UserFinalClosureProbe.lean 2>&1 | tee P02UserFinalClosureProbe.log
          if grep -E 'sorryAx' P02UserFinalClosureProbe.log; then exit 1; fi

      - name: Build terminal equivalence audit
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02TerminalEquivalenceAudit.lean 2>&1 | tee P02TerminalEquivalenceAudit.log
          if grep -E 'sorryAx' P02TerminalEquivalenceAudit.log; then exit 1; fi

      - name: Build RPA dual confirmation
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02RPADualConfirmation.lean 2>&1 | tee P02RPADualConfirmation.log
          if grep -E 'sorryAx' P02RPADualConfirmation.log; then exit 1; fi

      - name: Build endpoint lattice
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02EndpointLattice.lean 2>&1 | tee P02EndpointLattice.log
          if grep -E 'sorryAx' P02EndpointLattice.log; then exit 1; fi

      - name: Build endpoint lattice cube
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02EndpointLatticeCube.lean 2>&1 | tee P02EndpointLatticeCube.log
          if grep -E 'sorryAx' P02EndpointLatticeCube.log; then exit 1; fi

      - name: Build candidate-code fixed-point counterprobe
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02CandidateCodeFixedPointCounterprobe.lean 2>&1 | tee P02CandidateCodeFixedPointCounterprobe.log
          if grep -E 'sorryAx' P02CandidateCodeFixedPointCounterprobe.log; then exit 1; fi
