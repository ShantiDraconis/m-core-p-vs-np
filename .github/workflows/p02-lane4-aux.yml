name: p02-lane4-aux
on:
  workflow_dispatch:
concurrency:
  group: p02-lane4-aux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  aux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: P02-LANE-4 local/CI identical preflight
        run: |
          set -euo pipefail
          bash audit/preflight_local.sh 2>&1 | tee audit/P02-LANE4-PREFLIGHT.log

      - name: T7 RunCollapse probe
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02RunCollapseProbe.lean 2>&1 | tee audit/P02-RUNCOLLAPSE-PROBE.log
          if grep -E 'sorryAx' audit/P02-RUNCOLLAPSE-PROBE.log; then exit 1; fi

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-lane4-preflight
          path: |
            audit/P02-LANE4-PREFLIGHT.log
            audit/P02-RUNCOLLAPSE-PROBE.log
