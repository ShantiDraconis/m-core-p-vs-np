name: p02-lane4-aux
on:
  push:
    branches:
      - atk/p02-lane4-reuse-t10-audit-20261003
  workflow_dispatch:

jobs:
  aux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: P02-LANE-4 local/CI identical preflight
        run: |
          set -euo pipefail
          bash audit/preflight_local.sh 2>&1 | tee audit/P02-LANE4-PREFLIGHT.log

      - name: Upload preflight log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-lane4-preflight
          path: audit/P02-LANE4-PREFLIGHT.log
