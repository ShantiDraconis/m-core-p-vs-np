name: atk-p01-component-failproof

on:
  push:
    branches:
      - 'attack/p01-operational-sat-20260921'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01-component-failproof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: |
          lake update
          lake exe cache get || true
      - name: Source firewall
        run: |
          FILE=lean/MCore/Real/P01ComponentFailProof.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|native_decide|unsafe|cheat|bypass|placeholder|TODO|FIXME)([^[:alnum:]_]|$)' "$FILE"
          ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$FILE"
      - name: Compile P01 fail-proof
        run: lake build MCore.Real.P01ComponentFailProof
      - name: Axiom report
        run: |
          cat > P01Axioms.lean <<'EOF'
          import MCore.Real.P01ComponentFailProof
          #print axioms MCore.Real.P01ComponentFailProof.all_legacy_components_are_trivially_inhabited
          EOF
          lake env lean P01Axioms.lean | tee p01-axioms.txt
