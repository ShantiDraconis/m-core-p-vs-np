name: ATK T5 A3 composition

on:
  push:
    branches:
      - attack/t5-a3-close-contract-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t5-a3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Hygiene
        run: |
          set -euo pipefail
          f=lean/MCore/Real/P02T5A3Composition.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"
      - name: Build
        run: lake build MCore.Real.P02T5A3Composition
      - name: Axiom audit
        run: |
          cat >/tmp/T5A3Audit.lean <<'EOF'
          import MCore.Real.P02T5A3Composition
          #print axioms MCore.Real.P02T5A3Composition.t5_a3_closes_p02
          EOF
          lake env lean /tmp/T5A3Audit.lean 2>&1 | tee /tmp/t5-a3-audit.log
          ! grep -q 'sorryAx' /tmp/t5-a3-audit.log
      - name: Status
        run: |
          echo "T5_A3=WIRING_READY"
          echo "T5_A3_BLOCKER=T5_A2_UNIVERSAL_WITNESS"
