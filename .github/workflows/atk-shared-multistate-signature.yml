name: atk-shared-multistate-signature

on:
  push:
    branches:
      - atk/shared-multistate-signature-20260926
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Resolve dependencies
        run: |
          set -euo pipefail
          lake update
      - name: Source hygiene
        run: |
          set -euo pipefail
          if grep -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/MultiStateSignature.lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: Kernel compile
        run: |
          set -euo pipefail
          lake env lean lean/MCore/MultiStateSignature.lean 2>&1 | tee multistate-signature.log
          lake env lean audit/CrossProblemStructuralEvidence20260926.lean 2>&1 | tee cross-problem-structural-evidence.log
          if grep -q 'sorryAx' multistate-signature.log cross-problem-structural-evidence.log; then exit 1; fi
