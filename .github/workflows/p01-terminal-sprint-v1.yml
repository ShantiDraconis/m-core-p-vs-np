name: ATK P01 Terminal Sprint v1

on:
  push:
    branches:
      - "atk/p01-terminal-sprint-v1"
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Resolve dependencies
        run: lake update
      - name: Build exact P01 terminal delta
        run: lake build MCore.Real.P01TerminalDelta
      - name: Axiom audit
        run: |
          cat > /tmp/audit.lean <<'EOF'
          import MCore.Real.P01TerminalDelta
          #print axioms MCore.Real.P01TerminalDelta.p01_terminal_gap_closes
          #print axioms MCore.Real.P01TerminalDelta.parserPhase
          #print axioms MCore.Real.P01TerminalDelta.phaseLayout
          #print axioms MCore.Real.P01TerminalDelta.phaseBridge
          EOF
          lake env lean /tmp/audit.lean | tee /tmp/axioms.txt
          if grep -q "sorryAx" /tmp/axioms.txt; then exit 1; fi
      - name: Placeholder audit
        run: |
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/Real/P01TerminalDelta.lean
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/Real/P01TerminalDelta.lean
