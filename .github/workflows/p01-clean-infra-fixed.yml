name: P01 clean infra-fixed

on:
  push:
    branches:
      - atk/p02-kleene-bridge-fix-20260923
  workflow_dispatch:

permissions:
  contents: read

jobs:
  p01-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update

      - name: Fail-closed source hygiene
        run: |
          set -euo pipefail
          files=(
            lean/MCore/Real/Model.lean
            lean/MCore/Real/CanonicalFinalProof.lean
            lean/MCore/Real/CanonicalSATBoundary.lean
            lean/MCore/Real/CanonicalCircuitBits.lean
            lean/MCore/Real/CanonicalCircuitBitsInverse.lean
            lean/MCore/Real/CanonicalSATSlotParserSpec.lean
            lean/MCore/Real/CanonicalSATWitness.lean
            lean/MCore/Real/CanonicalSATVerifier.lean
            lean/MCore/Real/CanonicalSATNTMAttack.lean
            lean/MCore/Real/CanonicalSATParserAttack.lean
            lean/MCore/Real/CanonicalSATNatParserAttack.lean
            lean/MCore/Real/CanonicalSATVarPayloadMachine.lean
            lean/MCore/Real/CanonicalSATTagConsumerMachine.lean
            lean/MCore/Real/CanonicalSATParserTapeLayout.lean
            lean/MCore/Real/CanonicalSATParserInitMachine.lean
            lean/MCore/Real/CanonicalSATSlotLog.lean
            lean/MCore/Real/CanonicalSATParserMachine.lean
            lean/MCore/Real/CanonicalSATParserHeadProof.lean
            lean/MCore/Real/CanonicalSATParserRewindProof.lean
            lean/MCore/Real/CanonicalSATParserWorkScanProof.lean
            lean/MCore/Real/CanonicalSATParserMacroProof.lean
            lean/MCore/Real/CanonicalSATParserReturnProof.lean
            lean/MCore/Real/CanonicalSATParserLeafPopProof.lean
            lean/MCore/Real/CanonicalSATParserLeafReturnProof.lean
            lean/MCore/Real/CanonicalSATParserInitProof.lean
            lean/MCore/Real/MachineRunLemmas.lean
            lean/MCore/Real/CanonicalSATSlotLogMachine.lean
            lean/MCore/Real/CanonicalSATFrameAttack.lean
            lean/MCore/Real/CanonicalSATFrameMachineV2.lean
            lean/MCore/Real/P01VerifiedRelation.lean
            lean/MCore/Real/P01ComponentFailProof.lean
            lean/MCore/Real/P01RecursiveFiniteControlFrontier.lean
            lean/MCore/Real/CanonicalSATRecursiveParserSimulation.lean
            lean/MCore/Real/P02TerminalFrontier.lean
          )
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"; then exit 1; fi
          if grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "${files[@]}"; then exit 1; fi

      - name: Build recovered P01 chain
        run: |
          set -euo pipefail
          lake build \
            MCore.Real.CanonicalCircuitBitsInverse \
            MCore.Real.CanonicalSATSlotParserSpec \
            MCore.Real.CanonicalSATVarPayloadMachine \
            MCore.Real.CanonicalSATTagConsumerMachine \
            MCore.Real.CanonicalSATParserTapeLayout \
            MCore.Real.CanonicalSATParserInitMachine \
            MCore.Real.CanonicalSATSlotLog \
            MCore.Real.CanonicalSATSlotLogMachine \
            MCore.Real.CanonicalSATRecursiveParserSimulation \
            MCore.Real.MachineRunLemmas \
            MCore.Real.CanonicalSATParserInitProof \
            MCore.Real.CanonicalSATParserHeadProof \
            MCore.Real.CanonicalSATParserWorkScanProof \
            MCore.Real.CanonicalSATParserRewindProof \
            MCore.Real.CanonicalSATParserMacroProof \
            MCore.Real.CanonicalSATParserReturnProof \
            MCore.Real.CanonicalSATParserLeafPopProof \
            MCore.Real.CanonicalSATParserLeafReturnProof \
            MCore.Real.CanonicalSATFrameMachineV2 \
            MCore.Real.P01VerifiedRelation \
            MCore.Real.P01ComponentFailProof \
            MCore.Real.P01RecursiveFiniteControlFrontier \
            MCore.Real.P02TerminalFrontier
