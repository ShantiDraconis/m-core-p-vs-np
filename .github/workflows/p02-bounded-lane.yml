name: P02 bounded lane

on:
  push:
    branches:
      - atk/p02-kleene-bridge-fix-20260923
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - run: |
          set -euo pipefail
          files=(
            lean/MCore/Real/P02BoundedSemanticInput.lean
            lean/MCore/Real/P02BoundedDomain.lean
            lean/MCore/Real/P02BoundedFinalBridge.lean
            lean/MCore/Real/P02BoundedOpenMath.lean
            lean/MCore/Real/P02BoundedOpenMathFalsification.lean
            lean/MCore/Real/P02SemanticStabilityLane.lean
            lean/MCore/Real/P02FastPathAttack.lean
            lean/MCore/Real/P02RestrictionLowerBoundPattern.lean
            lean/MCore/Real/P02PaddingInheritanceAudit.lean
          )
          for f in "${files[@]}"; do test -f "$f"; done
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "${files[@]}"
          lake update
          lake build \
            MCore.Real.P02BoundedSemanticInput \
            MCore.Real.P02BoundedDomain \
            MCore.Real.PhysicalMachineCore \
            MCore.Real.P02KleeneBridge \
            MCore.Real.P02TableauCompletenessClose \
            MCore.Real.P01FinalCertificate \
            MCore.Real.FinalExternalCertificate \
            MCore.Real.P02BoundedFinalBridge \
            MCore.Real.P02BoundedOpenMath \
            MCore.Real.P02BoundedOpenMathFalsification \
            MCore.Real.P02SemanticStabilityLane \
            MCore.Real.P02FastPathAttack \
            MCore.Real.P02RestrictionLowerBoundPattern \
            MCore.Real.P02PaddingInheritanceAudit

