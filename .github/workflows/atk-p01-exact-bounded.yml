name: ATK P01 exact bounded
on:
  push:
    branches: [atk/auto-compose-terminal-20260930]
    paths:
      - 'lean/MCore/Real/P01ExactBoundedCircuitProducer.lean'
      - 'lean/MCore/Real/P01ExactOrBounded.lean'
      - 'lean/MCore/Real/P01CheckedVerifierGlobalBudget.lean'
      - '.github/workflows/atk-p01-exact-bounded.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build exact bounded producer
        run: |
          lake build MCore.Real.P01ExactBoundedCircuitProducer
          if [ -f lean/MCore/Real/P01ExactOrBounded.lean ]; then
            lake build MCore.Real.P01ExactOrBounded
          fi
