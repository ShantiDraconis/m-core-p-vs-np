name: ATK P03 Closure Repair

# Repair loop for the import closure of MCore.Real.P03PerfectFlipDichotomy
# (187 modules) on top of 19d2fb6b, Mathlib pinned to c44e0c8e.
# Every proof repair is listed in audit/p03-repair-20261025/REPAIRS.md;
# no theorem statement is changed.  All Lean errors are surfaced as
# annotations; the project build directory is cached between runs.

on:
  push:
    branches:
      - atk/p03-closure-repair-20261025
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore project build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: p03-repair-build-${{ github.sha }}
          restore-keys: |
            p03-repair-build-
      - name: Fetch Mathlib build cache
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
      - name: Build P03 closure and audit modules
        id: build
        shell: bash
        run: |
          set +e
          lake build MCore.Real.P03PerfectFlipDichotomy \
                     MCore.Integration.WinWinMissingHalfAudit20261024 > build.log 2>&1
          rc=$?
          tail -5 build.log
          python3 - <<'PY'
          import re
          text = open("build.log", errors="replace").read().splitlines()
          errs, cur = [], None
          for line in text:
              if line.startswith("error: ") and re.search(r"\.lean:\d+:\d+:", line):
                  cur = [line[7:]]
                  errs.append(cur)
              elif cur is not None and line and not line.startswith(("error:", "warning:", "info:", "✖", "⚠", "✔", "Build", "Some ")):
                  if len(cur) < 6:
                      cur.append(line.strip())
              else:
                  cur = None
          print("lean errors:", len(errs))
          chunk, size, n = [], 0, 0
          def flush():
              global chunk, size, n
              if chunk:
                  n += 1
                  msg = " || ".join(chunk).replace("%", "%25").replace("\r", "").replace("\n", " ")
                  print(f"::error title=lean-errors-{n}::{msg[:3800]}")
                  chunk, size = [], 0
          for e in errs:
              s = " | ".join(e)
              if size + len(s) > 3500:
                  flush()
              chunk.append(s); size += len(s)
          flush()
          failed = [l for l in text if "Lean exited" in l or l.startswith("✖")]
          for l in failed[:20]:
              print(f"::warning title=failed-target::{l[:900]}")
          PY
          if [ $rc -eq 0 ]; then
            echo "::notice title=build::BUILD PASS (P03PerfectFlipDichotomy + WinWinMissingHalfAudit20261024)"
          else
            echo "::error title=build::BUILD FAIL exit $rc"
          fi
          exit $rc
      - name: Save project build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: p03-repair-build-${{ github.sha }}
      - name: Exact axiom audit
        shell: bash
        run: |
          set +e
          cat > Probe.lean <<'LEAN'
          import MCore.Integration.WinWinMissingHalfAudit20261024
          #check @MCore.Real.P03PerfectFlipDichotomy.canonicalSAT_inP_implies_existsPerfectFlip
          #check @MCore.Real.P03PerfectFlipDichotomy.rangeFailureLaw_or_existsPerfectFlip
          #check @MCore.Integration.WinWinMissingHalfAudit20261024.perfectFlip_missing_half_iff_target
          #print axioms MCore.Real.P02ComplementRunRealization.complement_correctAt
          #print axioms MCore.Real.P02ComplementRunRealization.complement_reduce_correct
          #print axioms MCore.Real.P02ComplementRunRealization.selfInputAlignment_gives_flip
          #print axioms MCore.Real.P03PerfectFlipDichotomy.existsPerfectFlip_iff_not_rangeFailureLaw
          #print axioms MCore.Real.P03PerfectFlipDichotomy.rangeFailureLaw_or_existsPerfectFlip
          #print axioms MCore.Real.P03PerfectFlipDichotomy.sat_realization_candidate_perfectFlip
          #print axioms MCore.Real.P03PerfectFlipDichotomy.canonicalSAT_inP_implies_existsPerfectFlip
          #print axioms MCore.Real.P03PerfectFlipDichotomy.rangeFailureLaw_implies_canonicalSAT_not_inP
          #print axioms MCore.Integration.WinWinMissingHalfAudit20261024.present_half
          #print axioms MCore.Integration.WinWinMissingHalfAudit20261024.perfectFlip_missing_half_iff_target
          #print axioms MCore.Integration.WinWinMissingHalfAudit20261024.winwin_over_p03_iff_target
          #print axioms MCore.Integration.WinWinMissingHalfAudit20261024.winwin_over_p03_closes
          LEAN
          lake env lean Probe.lean > axioms.log 2>&1
          rc=$?
          cat axioms.log
          tr '\n' ' ' < axioms.log | sed -E "s/('MCore\.)/\n\1/g; s/(MCore\.[A-Za-z0-9_.]+ :)/\n\1/g" | grep -E "axioms|:" | sed -E 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=axioms::${l:0:900}"; done || true
          if [ $rc -ne 0 ] || grep -qE "sorryAx|error" axioms.log; then
            echo "::error title=axioms::probe failed or sorryAx found"; exit 1
          fi
          python3 - <<'PY'
          import re, sys
          text = open("axioms.log").read()
          sets = re.findall(r"depends on axioms: \[([^\]]*)\]", text, re.S)
          sets += ["" for _ in re.findall(r"does not depend on any axioms", text)]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          if len(sets) != 12:
              sys.exit("expected 12 axiom reports, got %d" % len(sets))
          for s in sets:
              names = {x.strip() for x in s.split(",") if x.strip()}
              if not names <= allowed:
                  sys.exit("non-standard axioms: %s" % (names - allowed))
          print("P03_AXIOM_AUDIT_OK")
          PY
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p03-repair-logs
          path: |
            build.log
            axioms.log
