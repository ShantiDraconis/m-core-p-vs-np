name: ATK P03 Closure Repair

# On top of 19d2fb6b, Mathlib pinned to c44e0c8e.
#   certify   : builds MCore.Real.P02ExactDiagonalFrontier (and with it the
#               repaired MCore.Real.P02ComplementRunRealization) and audits
#               the axioms of their theorems.  Must pass.
#   probe-p03 : informational; tries the full closure of
#               MCore.Real.P03PerfectFlipDichotomy and reports every Lean
#               error and every module built.  Allowed to fail.
# Every proof repair is listed in audit/p03-repair-20261025/REPAIRS.md;
# no theorem statement is changed.

on:
  push:
    branches:
      - atk/p03-closure-repair-20261025
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore project build cache
        uses: actions/cache/restore@v4
        with:
          path: .lake/build
          key: p03-repair-build-${{ github.sha }}-certify
          restore-keys: |
            p03-repair-build-
      - name: Fetch Mathlib build cache
        shell: bash
        run: |
          set -euo pipefail
          lean --version
          lake exe cache get
      - name: Build repaired modules
        shell: bash
        run: |
          set +e
          lake build MCore.Real.P02ExactDiagonalFrontier > build.log 2>&1
          rc=$?
          tail -5 build.log
          python3 - <<'PY'
          import re
          text = open("build.log", errors="replace").read().splitlines()
          errs, cur = [], None
          for line in text:
              if line.startswith("error: ") and re.search(r"\.lean:\d+:\d+:", line):
                  cur = [line[7:]]
                  errs.append(cur)
              elif cur is not None and line and not line.startswith(("error:", "warning:", "info:", "✖", "⚠", "✔", "Build", "Some ", "trace:")):
                  if len(cur) < 6:
                      cur.append(line.strip())
              else:
                  cur = None
          print("lean errors:", len(errs))
          def emit(kind, title, items, limit=3500):
              chunk, size, n = [], 0, 0
              for s in items + [None]:
                  if s is None or size + len(s) > limit:
                      if chunk:
                          n += 1
                          msg = " || ".join(chunk).replace("%", "%25").replace("\r", "")
                          print(f"::{kind} title={title}-{n}::{msg[:3800]}")
                      chunk, size = [], 0
                  if s is not None:
                      chunk.append(s); size += len(s)
          emit("error", "lean-errors", [" | ".join(e) for e in errs])
          failed = [l.split("Building ")[-1] for l in text if l.startswith("✖")]
          import os
          def imports(m):
              f = "lean/" + m.replace(".", "/") + ".lean"
              return re.findall(r"^import\s+(\S+)", open(f).read(), re.M) if os.path.exists(f) else None
          seen, todo = set(), ["MCore.Real.P03PerfectFlipDichotomy", "MCore.Integration.WinWinMissingHalfAudit20261024"]
          while todo:
              m = todo.pop()
              if m in seen or not m.startswith("MCore"): continue
              seen.add(m); todo += imports(m) or []
          def has_olean(m):
              rel = m.replace(".", "/") + ".olean"
              return any(os.path.exists(os.path.join(d, rel)) for d in (".lake/build/lib/lean", ".lake/build/lib"))
          built = sorted(m for m in seen if has_olean(m))
          missing = sorted(m for m in seen if not has_olean(m))
          print(f"closure {len(seen)} built {len(built)} missing {len(missing)}")
          emit("notice", "closure-missing-olean", missing)
          emit("warning", "failed-modules", failed)
          print(f"::notice title=closure::P03 closure {len(seen)} modules, built {len(built)}, missing {len(missing)}")
          PY
          if [ $rc -eq 0 ]; then
            echo "::notice title=build::BUILD PASS (MCore.Real.P02ExactDiagonalFrontier, MCore.Real.P02ComplementRunRealization)"
          else
            echo "::error title=build::BUILD FAIL exit $rc"
          fi
          exit $rc
      - name: Save project build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .lake/build
          key: p03-repair-build-${{ github.sha }}-certify
      - name: Exact axiom audit
        shell: bash
        run: |
          set +e
          cat > Probe.lean <<'LEAN'
          import MCore.Real.P02ExactDiagonalFrontier
          #check @MCore.Real.P02ComplementRunRealization.complement_reduce_correct
          #check @MCore.Real.P02ExactDiagonalFrontier.total_exact_diagonal_iff_universal_failure
          #print axioms MCore.Real.P02ComplementRunRealization.runBranches_complement_to_tm_run
          #print axioms MCore.Real.P02ComplementRunRealization.complement_correctAt
          #print axioms MCore.Real.P02ComplementRunRealization.complement_reduce_correct
          #print axioms MCore.Real.P02ComplementRunRealization.selfInputAlignment_gives_flip
          #print axioms MCore.Real.P02ExactDiagonalFrontier.flip_implies_not_correctAt
          #print axioms MCore.Real.P02ExactDiagonalFrontier.flip_iff_not_correctAt_of_halt
          #print axioms MCore.Real.P02ExactDiagonalFrontier.total_exact_diagonal_iff_universal_failure
          #print axioms MCore.Real.P02ExactDiagonalFrontier.total_exact_diagonal_closes_internal_endpoint
          LEAN
          lake env lean Probe.lean > axioms.log 2>&1
          rc=$?
          cat axioms.log
          tr '\n' ' ' < axioms.log | sed -E "s/('MCore\.)/\n\1/g; s/(MCore\.[A-Za-z0-9_.]+ :)/\n\1/g" | grep -E "axioms|:" | sed -E 's/%/%25/g' | while IFS= read -r l; do echo "::notice title=axioms::${l:0:900}"; done || true
          if [ $rc -ne 0 ] || grep -qE "sorryAx|error" axioms.log; then
            echo "::error title=axioms::probe failed or sorryAx found"; exit 1
          fi
          python3 - <<'PY'
          import re, sys
          text = open("axioms.log").read()
          sets = re.findall(r"depends on axioms: \[([^\]]*)\]", text, re.S)
          sets += ["" for _ in re.findall(r"does not depend on any axioms", text)]
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          if len(sets) != 8:
              sys.exit("expected 8 axiom reports, got %d" % len(sets))
          for s in sets:
              names = {x.strip() for x in s.split(",") if x.strip()}
              if not names <= allowed:
                  sys.exit("non-standard axioms: %s" % (names - allowed))
          print("P02_REPAIR_AXIOM_AUDIT_OK")
          PY

  probe-p03:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
