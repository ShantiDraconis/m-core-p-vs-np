name: T1C verifier-composition worker
on:
  push:
    branches: [ attack/t1c-verifier-composition-20260922 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t1c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - run: |
          set -euo pipefail
          files=(
            lean/MCore/Real/P01VerifierGateMachine.lean
            lean/MCore/Real/P01VerifierComposition.lean
          )
          for f in "${files[@]}"; do test -f "$f"; done
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "${files[@]}"
          lake build MCore.Real.P01VerifierGateMachine MCore.Real.P01VerifierComposition
          cat >/tmp/terminal.lean <<'EOF'
          import MCore.Real.P01VerifierComposition
          #check MCore.Real.P01VerifierComposition.verifier_composition_closed
          #print axioms MCore.Real.P01VerifierComposition.verifier_composition_closed
          EOF
          lake env lean /tmp/terminal.lean 2>&1 | tee /tmp/terminal.log
          if grep -q 'sorryAx' /tmp/terminal.log; then exit 1; fi
