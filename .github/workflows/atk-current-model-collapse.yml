name: ATK current model collapse
on:
  push:
    branches: [atk/auto-compose-terminal-20260930]
    paths:
      - 'lean/MCore/Real/CurrentModelCollapse.lean'
      - '.github/workflows/atk-current-model-collapse.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collapse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build model-collapse theorem
        run: lake build MCore.Real.CurrentModelCollapse
