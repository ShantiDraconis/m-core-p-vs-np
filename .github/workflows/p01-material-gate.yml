name: p01-material-gate

on:
  push:
    branches:
      - atk/p01-material-inhabitant-frontier-20260930
  workflow_dispatch:

jobs:
  material:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Resolve pinned dependencies
        shell: bash
        run: |
          set -euo pipefail
          lake update

      - name: Build P01 material frontier
        shell: bash
        run: |
          set -euo pipefail
          lake build \
            MCore.Real.P01ExactBoundedCircuitProducer \
            MCore.Real.P01ExactBoundedBinary \
            MCore.Real.P01ExactBoundedAll \
            MCore.Real.P01CheckedEvalRejectBounded \
            MCore.Real.P01MaterialGlobalBudget \
            MCore.Real.P01MalformedRawBoundedReject \
            MCore.Real.P01CoreDecodeFailureBudget \
            MCore.Real.P01CoreDecodeFailurePhysical \
            MCore.Real.P01RawVerifierFromCoreReject \
            MCore.Real.P01CheckedVerifierStateCodec \
            MCore.Real.P01MaterialInhabitantFrontier \
            MCore.Real.P01GlobalParserBound \
            MCore.Real.CanonicalSATParserNTM \
            MCore.Real.P01ParserWitnessComposition \
            MCore.Real.P01ParserFirewall \
            MCore.Real.P01TerminalCertificate

      - name: Material axiom audit
        shell: bash
        run: |
          set -euo pipefail
          cat > P01MaterialAudit.lean <<'EOF'
          import MCore.Real.P01ExactBoundedAll
          import MCore.Real.P01CheckedEvalRejectBounded
          import MCore.Real.P01MalformedRawBoundedReject
          import MCore.Real.P01CoreDecodeFailureBudget
          import MCore.Real.P01CoreDecodeFailurePhysical
          import MCore.Real.P01RawVerifierFromCoreReject
          import MCore.Real.P01CheckedVerifierStateCodec
          import MCore.Real.P01MaterialInhabitantFrontier
          import MCore.Real.P01ParserWitnessComposition
          import MCore.Real.P01ParserFirewall
          import MCore.Real.P01TerminalCertificate
          #print axioms MCore.Real.P01ExactBoundedAll.exact_bounded_all
          #print axioms MCore.Real.P01CheckedEvalRejectBounded.bounded_circuit_reject_certificate
          #print axioms MCore.Real.P01MalformedRawBoundedReject.decodeCircuit_none_split
          #print axioms MCore.Real.P01MalformedRawBoundedReject.checked_nonempty_source_reaches_reject
          #print axioms MCore.Real.P01MalformedRawBoundedReject.core_success_with_trailing_reaches_reject_bounded
          #print axioms MCore.Real.P01MalformedRawBoundedReject.checkedCircuitBudget_plus_loop_le_material
          #print axioms MCore.Real.P01MalformedRawBoundedReject.malformed_raw_reaches_reject_bounded_of_core
          #print axioms MCore.Real.P01CoreDecodeFailureBudget.root_potential_le_material
          #print axioms MCore.Real.P01CoreDecodeFailurePhysical.coreDecodeFailurePhysicalAux
          #print axioms MCore.Real.P01CoreDecodeFailurePhysical.coreDecodeFailurePhysicalReject
          #print axioms MCore.Real.P01RawVerifierFromCoreReject.rawVerifierMaterialCoreOfCoreReject
          #print axioms MCore.Real.P01CheckedVerifierStateCodec.checkedVerifier_decode_encode
          #print axioms MCore.Real.P01CoreDecodeFailurePhysical.p01ConstructionGap
          #print axioms MCore.Real.P01MaterialInhabitantFrontier.p01_of_raw_material_core
          #print axioms MCore.Real.P01GlobalParserBound.slot_parser_machine_simulation_certificate
          #print axioms MCore.Real.P01ParserWitnessComposition.parserPhaseCertificate
          #print axioms MCore.Real.P01ParserFirewall.decode_none_iff_parser_not_accepts
          #print axioms MCore.Real.P01TerminalCertificate.p01ConstructionGap
          #print axioms MCore.Real.P01TerminalCertificate.canonicalSATMachineClosure
          EOF
          lake env lean P01MaterialAudit.lean 2>&1 | tee P01MaterialAudit.log
          if grep -q 'sorryAx' P01MaterialAudit.log; then
            echo "sorryAx found in material frontier"
            exit 1
          fi

      - name: Source hygiene
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            lean/MCore/Real/P01ExactBoundedBinary.lean \
            lean/MCore/Real/P01ExactBoundedAll.lean \
            lean/MCore/Real/P01CheckedEvalRejectBounded.lean \
            lean/MCore/Real/P01MalformedRawBoundedReject.lean \
            lean/MCore/Real/P01MaterialGlobalBudget.lean \
            lean/MCore/Real/P01CoreDecodeFailureBudget.lean \
            lean/MCore/Real/P01CoreDecodeFailurePhysical.lean \
            lean/MCore/Real/P01RawVerifierFromCoreReject.lean \
            lean/MCore/Real/P01CheckedVerifierStateCodec.lean \
            lean/MCore/Real/P01MaterialInhabitantFrontier.lean \
            lean/MCore/Real/P01TerminalCertificate.lean
          do
            if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)|^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"; then
              exit 1
            fi
          done
