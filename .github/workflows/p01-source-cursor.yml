name: ATK P01 source cursor

on:
  push:
    branches:
      - atk/p01-source-cursor-invariant-20260929
    paths:
      - 'lean/MCore/Real/P01SourceCursorInvariant.lean'
      - '.github/workflows/p01-source-cursor.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-cursor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Kernel build source cursor
        run: lake build MCore.Real.P01SourceCursorInvariant
      - name: Axiom audit
        run: |
          cat > P01SourceCursorAxiomAudit.lean <<'EOF'
          import MCore.Real.P01SourceCursorInvariant
          #print axioms MCore.Real.P01SourceCursorInvariant.moveToSourceStart_head_correct
          #print axioms MCore.Real.P01SourceCursorInvariant.execMoves_left_right_cancel
          #print axioms MCore.Real.P01SourceCursorInvariant.source_cursor_roundTrip_tape
          #print axioms MCore.Real.P01SourceCursorInvariant.source_cursor_roundTrip_length
          EOF
          lake env lean P01SourceCursorAxiomAudit.lean | tee P01SourceCursorAxiomAudit.log
          if grep -F 'sorryAx' P01SourceCursorAxiomAudit.log; then exit 1; fi
      - name: Reject proof escapes
        run: |
          set -euo pipefail
          if grep -nE '^[[:space:]]*(sorry|axiom|admit)[[:space:]]' lean/MCore/Real/P01SourceCursorInvariant.lean; then
            echo 'proof escape found'
            exit 1
          fi
