name: Structural Fixed Point Break

on:
  push:
    branches:
      - atk/structural-fixed-point-20261006
    paths:
      - 'lean/MCore/Real/StructuralFixedPointBreak.lean'
      - '.github/workflows/structural-fixed-point-break.yml'
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Build
        run: |
          set -euo pipefail
          lake build MCore.Real.StructuralFixedPointBreak
      - name: Audit
        run: |
          set -euo pipefail
          file=lean/MCore/Real/StructuralFixedPointBreak.lean
          if grep -En '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' "$file"; then
            echo 'AUDIT_FAIL proof escape'
            exit 1
          fi
          cat > /tmp/StructuralFixedPointBreakAudit.lean <<'EOF'
          import MCore.Real.StructuralFixedPointBreak
          #print axioms MCore.Real.StructuralFixedPointBreak.hdiag_real_implies_not_correctAt
          #print axioms MCore.Real.StructuralFixedPointBreak.perelman_break_closes_g2_terminal
          #print axioms MCore.Real.StructuralFixedPointBreak.perelmanBreakWitness
          #print axioms MCore.Real.StructuralFixedPointBreak.perelman_break_closes_p_ne_np
          EOF
          lake env lean /tmp/StructuralFixedPointBreakAudit.lean 2>&1 | tee /tmp/structural-fixed-point-break.log
          if grep -q 'sorryAx' /tmp/structural-fixed-point-break.log; then
            echo 'AUDIT_FAIL sorryAx'
            exit 1
          fi
          echo 'STRUCTURAL_FIXED_POINT_BREAK_GREEN'
