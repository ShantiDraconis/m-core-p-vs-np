name: ATK T5 semantic self embedding

on:
  push:
    branches:
      - attack/t5-a2-semantic-self-embedding-20260922
      - attack/t5-a2-universal-existence-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t5-a2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Hygiene
        run: |
          set -euo pipefail
          file=lean/MCore/Real/P02SemanticSelfEmbedding.lean
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then exit 1; fi
          if grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$file"; then exit 1; fi

      - name: Build T5 A2 boundary
        run: lake build MCore.Real.P02SemanticSelfEmbedding

      - name: Axiom audit
        run: |
          cat >/tmp/T5A2Audit.lean <<'EOF'
          import MCore.Real.P02SemanticSelfEmbedding
          #print axioms MCore.Real.P02SemanticSelfEmbedding.semantic_self_embedding_gap_iff_diagonal_fixed_point_gap
          #print axioms MCore.Real.P02SemanticSelfEmbedding.semantic_self_embedding_closes_p02
          EOF
          lake env lean /tmp/T5A2Audit.lean 2>&1 | tee /tmp/t5-a2-audit.log
          if grep -q 'sorryAx' /tmp/t5-a2-audit.log; then exit 1; fi

      - name: Fail closed status
        run: |
          echo "T5_A2_INTERFACE=BUILDABLE"
          echo "T5_A2_EXISTENCE=OPEN_MATH"
