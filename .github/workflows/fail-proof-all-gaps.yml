name: fail-proof-all-gaps

on: [push, pull_request]

jobs:
  canonical-model:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version || true
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: Build canonical P subset NP and interface bridge
        run: |
          set -euo pipefail
          lake build MCore.Real.CanonicalPSubsetNP MCore.Real.CanonicalComplexityBridge
      - name: Axiom audit canonical model
        run: |
          set -euo pipefail
          cat > GapCanonicalModelAudit.lean <<'EOF'
          import MCore.Real.CanonicalPSubsetNP
          import MCore.Real.CanonicalComplexityBridge
          #print axioms MCore.Real.CanonicalPSubsetNP.inP_subset_inNP
          #print axioms MCore.Real.CanonicalComplexityBridge.canonical_failure_witness_separates_legacy_interface
          EOF
          lake env lean GapCanonicalModelAudit.lean 2>&1 | tee gap-canonical-model.log
          if grep -q 'sorryAx' gap-canonical-model.log; then exit 1; fi

  gap-compression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version || true
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: Build G1-G3 compression and finite-evidence attack
        run: |
          set -euo pipefail
          lake build MCore.Real.FailProofAllGaps MCore.Real.FailProofFiniteAttack MCore.Real.CanonicalSATBoundary
      - name: Axiom audit compressed endpoint
        run: |
          set -euo pipefail
          cat > GapCompressionAudit.lean <<'EOF'
          import MCore.Real.FailProofAllGaps
          import MCore.Real.FailProofFiniteAttack
          import MCore.Real.CanonicalSATBoundary
          #print axioms MCore.Real.FailProofAllGaps.failure_generator_implies_universal_failure
          #print axioms MCore.Real.FailProofAllGaps.failure_generator_iff_universal_failure
          #print axioms MCore.Real.FailProofAllGaps.final_gap_certificate_closes
          #print axioms MCore.Real.FailProofFiniteAttack.finite_to_universal_principle_refuted
          #print axioms MCore.Real.CanonicalSATBoundary.sat_external_closure_implies_official_separation
          EOF
          lake env lean GapCompressionAudit.lean 2>&1 | tee gap-compression.log
          if grep -q 'sorryAx' gap-compression.log; then exit 1; fi

  sat-foundations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version || true
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: Build exact SAT bit encoding witness and verifier
        run: |
          set -euo pipefail
          lake build MCore.Real.CanonicalCircuitBits MCore.Real.CanonicalSATWitness MCore.Real.CanonicalSATVerifier
      - name: Build canonical SAT NTM attack
        run: |
          set -euo pipefail
          lake build MCore.Real.CanonicalSATNTMAttack

      - name: Build canonical SAT parser attack
        run: |
          set -euo pipefail
          lake build MCore.Real.CanonicalSATParserAttack

      - name: Build canonical SAT unary payload attack
        run: |
          set -euo pipefail
          lake build MCore.Real.CanonicalSATNatParserAttack

      - name: Axiom audit canonical SAT unary payload attack
        run: |
          set -euo pipefail
          cat > CanonicalSATNatParserAttackAudit.lean <<'EOF'
          import MCore.Real.CanonicalSATNatParserAttack
          #print axioms MCore.Real.CanonicalSATNatParserAttack.nat_run_encodeNat_state
          #print axioms MCore.Real.CanonicalSATNatParserAttack.nat_scan_encodeNat_halts_linear
          #print axioms MCore.Real.CanonicalSATNatParserAttack.nat_scan_blank_rejects
          EOF
          lake env lean CanonicalSATNatParserAttackAudit.lean 2>&1 | tee gap-sat-nat-parser-attack.log
          if grep -q 'sorryAx' gap-sat-nat-parser-attack.log; then exit 1; fi

      - name: Axiom audit canonical SAT parser attack
        run: |
          set -euo pipefail
          cat > CanonicalSATParserAttackAudit.lean <<'EOF'
          import MCore.Real.CanonicalSATParserAttack
          #print axioms MCore.Real.CanonicalSATParserAttack.tag_input_state
          #print axioms MCore.Real.CanonicalSATParserAttack.tag_false_const_state
          #print axioms MCore.Real.CanonicalSATParserAttack.tag_true_const_state
          #print axioms MCore.Real.CanonicalSATParserAttack.tag_not_state
          #print axioms MCore.Real.CanonicalSATParserAttack.tag_and_state
          #print axioms MCore.Real.CanonicalSATParserAttack.tag_or_state
          #print axioms MCore.Real.CanonicalSATParserAttack.tag_invalid_11_rejects
          EOF
          lake env lean CanonicalSATParserAttackAudit.lean 2>&1 | tee gap-sat-parser-attack.log
          if grep -q 'sorryAx' gap-sat-parser-attack.log; then exit 1; fi

      - name: Axiom audit canonical SAT NTM attack
        run: |
          set -euo pipefail
          cat > CanonicalSATNTMAttackAudit.lean <<'EOF'
          import MCore.Real.CanonicalSATNTMAttack
          #print axioms MCore.Real.CanonicalSATNTMAttack.scan_step_cons
          #print axioms MCore.Real.CanonicalSATNTMAttack.scan_step_nil
          #print axioms MCore.Real.CanonicalSATNTMAttack.scan_run_reaches_halt
          #print axioms MCore.Real.CanonicalSATNTMAttack.scan_halts_within_linear
          #print axioms MCore.Real.CanonicalSATNTMAttack.canonical_sat_machine_closure_gives_bridge
          EOF
          lake env lean CanonicalSATNTMAttackAudit.lean 2>&1 | tee gap-sat-ntm-attack.log
          if grep -q 'sorryAx' gap-sat-ntm-attack.log; then exit 1; fi

      - name: Axiom audit SAT foundations
        run: |
          set -euo pipefail
          cat > GapSATFoundationsAudit.lean <<'EOF'
          import MCore.Real.CanonicalCircuitBits
          import MCore.Real.CanonicalSATWitness
          import MCore.Real.CanonicalSATVerifier
          #print axioms MCore.Real.CanonicalCircuitBits.decodeCircuit_encode
          #print axioms MCore.Real.CanonicalCircuitBits.canonical_sat_encoding_closed
          #print axioms MCore.Real.CanonicalSATWitness.satLanguage_iff_exists_finite_witness
          #print axioms MCore.Real.CanonicalSATWitness.witness_bits_linear_bound
          #print axioms MCore.Real.CanonicalSATVerifier.verifyWitness_correct
          #print axioms MCore.Real.CanonicalSATVerifier.verificationCost_linear_encoding_bound
          #print axioms MCore.Real.CanonicalSATVerifier.sat_has_short_verified_witness
          EOF
          lake env lean GapSATFoundationsAudit.lean 2>&1 | tee gap-sat-foundations.log
          if grep -q 'sorryAx' gap-sat-foundations.log; then exit 1; fi

  negative-attacks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/lean" --version || true
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: Build arbitrary-encoder and finite-evidence refutations
        run: |
          set -euo pipefail
          lake build MCore.Real.FinalProofAttack MCore.Real.FailProofFiniteAttack
      - name: Reproduce raw Potential semantic counterexample
        run: |
          set -euo pipefail
          lake env lean audit/C12/SRepresentationCounterexample.lean 2>&1 | tee gap-potential-counterexample.log
          grep -q 'direct_potential_semantic_identification_refuted' gap-potential-counterexample.log
          if grep -q 'sorryAx' gap-potential-counterexample.log; then exit 1; fi
      - name: Axiom audit negative attacks
        run: |
          set -euo pipefail
          cat > GapNegativeAudit.lean <<'EOF'
          import MCore.Real.FinalProofAttack
          import MCore.Real.FailProofFiniteAttack
          #print axioms MCore.Real.FinalProofAttack.current_SATNotInP_refuted
          #print axioms MCore.Real.FinalProofAttack.current_UniversalSATFailure_refuted
          #print axioms MCore.Real.FailProofFiniteAttack.finite_to_universal_principle_refuted
          EOF
          lake env lean GapNegativeAudit.lean 2>&1 | tee gap-negative.log
          if grep -q 'sorryAx' gap-negative.log; then exit 1; fi
