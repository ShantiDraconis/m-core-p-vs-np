name: ATK P02 Total Semantic Failure

on:
  push:
    branches:
      - atk/p02-universal-failure-odd-parity-20261005
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        uses: leanprover/lean-action@v1
      - name: Verify toolchain
        run: |
          set -euo pipefail
          lean --version
          lake --version
      - name: Build P02 total semantic failure mincut
        run: |
          set -euo pipefail
          lake build MCore.Real.P02TotalCandidateFailureMinCut
          lake build MCore.Real.P02SemanticInvariantCore
          lake build MCore.Real.P02SemanticNegationReduction
          lake build MCore.Real.P02SemanticNegationCounterexample
          lake build MCore.Real.P02ExactnessKernelFinalRefutation
          lake build MCore.Real.P02TwoSidedExactnessAudit
          lake build MCore.Real.P02EqualityBranchMaterialFrontier
          lake build MCore.Real.P02CookLevinComputationAtom
          lake build MCore.Real.P02DeterministicCompositionAtom
      - name: Axiom and placeholder audit
        run: |
          set -euo pipefail
          cat > P02TotalCandidateFailureMinCutAudit.lean <<'EOF'
          import MCore.Real.P02TotalCandidateFailureMinCut
          import MCore.Real.P02SemanticInvariantCore
          import MCore.Real.P02SemanticNegationReduction
          import MCore.Real.P02SemanticNegationCounterexample
          import MCore.Real.P02ExactnessKernelFinalRefutation
          import MCore.Real.P02TwoSidedExactnessAudit
          import MCore.Real.P02EqualityBranchMaterialFrontier
          import MCore.Real.P02CookLevinComputationAtom
          import MCore.Real.P02DeterministicCompositionAtom
          #print axioms MCore.Real.P02TotalCandidateFailureMinCut.TotalSemanticFailureProducer.toFailureGenerator
          #print axioms MCore.Real.P02TotalCandidateFailureMinCut.totalSemanticFailureProducer_implies_universalFailure
          #print axioms MCore.Real.P02TotalCandidateFailureMinCut.totalSemanticFailureProducer_closes_internal_endpoint
          #print axioms MCore.Real.P02TotalCandidateFailureMinCut.totalSemanticFailureProducer_of_universalFailure
          #print axioms MCore.Real.P02TotalCandidateFailureMinCut.totalSemanticFailureProducer_iff_universalFailure
          #print axioms MCore.Real.P02SemanticInvariantCore.invariantPoint_gives_semantic_failure
          #print axioms MCore.Real.P02SemanticInvariantCore.invariantFamily_to_totalSemanticFailure
          #print axioms MCore.Real.P02SemanticInvariantCore.totalInvariantPoint_closes_G2
          #print axioms MCore.Real.P02SemanticNegationReduction.semanticNegationBits_flip
          #print axioms MCore.Real.P02SemanticNegationReduction.semanticNegationReduction
          #print axioms MCore.Real.P02SemanticNegationReduction.semanticNegationInvariant_closes_G2
          #print axioms MCore.Real.P02SemanticNegationCounterexample.secondBitCandidate_total
          #print axioms MCore.Real.P02SemanticNegationCounterexample.secondBit_semanticNegation_flips
          #print axioms MCore.Real.P02SemanticNegationCounterexample.semanticNegationInvariant_open_math_refuted
          #print axioms MCore.Real.P02ExactnessKernelFinalRefutation.semantic_negation_invariant_refuted
          #print axioms MCore.Real.P02ExactnessKernelFinalRefutation.mincut_exact_form
          #print axioms MCore.Real.P02ExactnessKernelFinalRefutation.realization_refutes_universalFailure
          #print axioms MCore.Real.P02ExactnessKernelFinalRefutation.realization_refutes_totalSemanticFailure
          #print axioms MCore.Real.P02ExactnessKernelFinalRefutation.G2_exactness_closed_by_refutation
          #print axioms MCore.Real.P02ExactnessKernelFinalRefutation.refutationWitness_iff_sat_in_p
          #print axioms MCore.Real.P02TwoSidedExactnessAudit.canonicalSAT_inNP
          #print axioms MCore.Real.P02TwoSidedExactnessAudit.sat_in_p_implies_p_eq_np
          #print axioms MCore.Real.P02TwoSidedExactnessAudit.sat_not_in_p_implies_p_ne_np
          #print axioms MCore.Real.P02TwoSidedExactnessAudit.orient_from_canonicalSAT
          #print axioms MCore.Real.P02TwoSidedExactnessAudit.g2_refutation_witness_iff_sat_in_p
          #print axioms MCore.Real.P02TwoSidedExactnessAudit.g2_proved_implies_p_ne_np
          #print axioms MCore.Real.P02EqualityBranchMaterialFrontier.EqualityMaterialProducer.toTransfer
          #print axioms MCore.Real.P02EqualityBranchMaterialFrontier.equalityMaterialProducer_closes_p_eq_np
          #print axioms MCore.Real.P02CookLevinComputationAtom.CookLevinInstanceProducer.toMaterial
          #print axioms MCore.Real.P02CookLevinComputationAtom.universalCookLevin_of_instanceProducer
          #print axioms MCore.Real.P02DeterministicCompositionAtom.composition_of_pointwise
          #print axioms MCore.Real.P02DeterministicCompositionAtom.composition_implies_pointwise
          #print axioms MCore.Real.P02DeterministicCompositionAtom.composition_iff_pointwise
          EOF
          lake env lean P02TotalCandidateFailureMinCutAudit.lean 2>&1 | tee /tmp/p02-total-semantic-axioms.log
          if grep -E 'sorryAx' /tmp/p02-total-semantic-axioms.log; then exit 1; fi
          if grep -En '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' lean/MCore/Real/P02TotalCandidateFailureMinCut.lean; then exit 1; fi
          echo P02_TOTAL_SEMANTIC_FAILURE_MINCUT_GREEN
