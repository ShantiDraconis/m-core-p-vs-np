name: ATK t1-d terminal integration
on:
  push:
    branches:
      - atk/t1-d-terminal-construction-20260922
  workflow_dispatch:
permissions:
  contents: read
jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: Build certified integration inputs
        run: |
          lake build MCore.Real.P01IntegratedMachine
          lake build MCore.Real.P01IntegratedPhaseSemantics
          lake build MCore.Real.P01PhysicalRealizationAssembly
          lake build MCore.Real.P01PolynomialBudgetAlgebra
          lake build MCore.Real.P01ConstructionClose
          lake build MCore.P012.P012Core
          lake build MCore.P012.P012ProducerStatus
          lake build MCore.P012.P012FormulaSemantics
          lake build MCore.P012.P012Flow
          lake build MCore.P012.P012Entropy
          lake build MCore.P012.P012MetaClosure
          lake build MCore.P012.P012Interpretation
          lake build MCore.P012.P012SignedThirdTransitions
          lake build MCore.P012.P012PrimeTransitionBoundary
          lake build MCore.P012.P012SignedOrientationInterpretation
          lake build MCore.P012.P012PrimeKernel
          lake build MCore.P012.P012OddPrimeGap
          lake build MCore.P012.P012TraversalTheorem
          lake build MCore.P012.P012TraversalClosure
          lake build MCore.Real.FinalProofEvidencePromotion
      - name: Hygiene
        run: |
          set -euo pipefail
          for file in             lean/MCore/Real/P01IntegratedMachine.lean             lean/MCore/Real/P01IntegratedPhaseSemantics.lean             lean/MCore/Real/P01PhysicalRealizationAssembly.lean             lean/MCore/Real/P01PolynomialBudgetAlgebra.lean             lean/MCore/Real/P01ConstructionClose.lean             lean/MCore/P012/P012Core.lean             lean/MCore/P012/P012ProducerStatus.lean             lean/MCore/P012/P012FormulaSemantics.lean             lean/MCore/P012/P012Flow.lean             lean/MCore/P012/P012Entropy.lean             lean/MCore/P012/P012MetaClosure.lean             lean/MCore/P012/P012Interpretation.lean             lean/MCore/P012/P012SignedThirdTransitions.lean             lean/MCore/P012/P012PrimeTransitionBoundary.lean             lean/MCore/P012/P012SignedOrientationInterpretation.lean             lean/MCore/P012/P012PrimeKernel.lean             lean/MCore/P012/P012OddPrimeGap.lean             lean/MCore/P012/P012TraversalTheorem.lean             lean/MCore/P012/P012TraversalClosure.lean             lean/MCore/Real/FinalProofEvidencePromotion.lean
          do
            if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then exit 1; fi
            if grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$file"; then exit 1; fi
          done
      - name: Fail closed terminal
        run: echo "T1_D_TERMINAL=P01MachineConstruction_REQUIRED"
