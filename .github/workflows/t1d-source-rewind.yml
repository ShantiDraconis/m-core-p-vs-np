name: T1D Source Rewind

on:
  push:
    branches:
      - attack/t1d-source-rewind-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-rewind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Hygiene
        run: |
          set -euo pipefail
          f=lean/MCore/Real/P01FullVerifierSourceRewind.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"
      - name: Build
        run: lake build MCore.Real.P01FullVerifierSourceRewind
      - name: Axiom audit
        run: |
          cat >/tmp/RewindAudit.lean <<'EOF'
          import MCore.Real.P01FullVerifierSourceRewind
          #print axioms MCore.Real.P01FullVerifierSourceRewind.sourceRewindTimeBound_poly
          #print axioms MCore.Real.P01FullVerifierSourceRewind.sourceRewind_enter_step
          #print axioms MCore.Real.P01FullVerifierSourceRewind.sourceRewind_separator_step
          EOF
          lake env lean /tmp/RewindAudit.lean 2>&1 | tee /tmp/rewind-audit.log
          ! grep -q 'sorryAx' /tmp/rewind-audit.log
