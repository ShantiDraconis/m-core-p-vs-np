name: Terminal law targeted build

on:
  push:
    branches:
      - 'atk/terminal-parameter-law-*'
    paths:
      - 'lean/MCore/Real/PvsNPTerminalLaw.lean'
      - '.github/workflows/terminal-law-targeted-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build-args: MCore.Real.PvsNPTerminalLaw
