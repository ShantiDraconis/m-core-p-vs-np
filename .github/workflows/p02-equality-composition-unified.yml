name: P02 Equality Composition Unified

on:
  push:
    branches:
      - atk/p02-equality-composition-unified
    paths:
      - 'lean/MCore/Real/P02EqualityCompositionUnified.lean'
      - 'lean/MCore/Real/P02DeterministicReductionCompositionMaterial.lean'
      - 'lean/MCore/Real/P02TerminalForcingSAT.lean'
      - '.github/workflows/p02-equality-composition-unified.yml'
  workflow_dispatch:

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Install Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/elan" default "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          "$HOME/.elan/bin/lake" --version

      - name: Kernel build unified formula
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake build MCore.Real.P02EqualityCompositionUnified
          lake build MCore.Real.P02DeterministicReductionCompositionMaterial
          lake build MCore.Real.P02TerminalForcingSAT

      - name: Kernel axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat > P02EqualityCompositionUnifiedAudit.lean <<'EOF'
          import MCore.Real.P02EqualityCompositionUnified
          #print axioms MCore.Real.P02EqualityCompositionUnified.hosted_priority_same_formula
          #print axioms MCore.Real.P02EqualityCompositionUnified.SequentialCompositionUnified
          #print axioms MCore.Real.P02EqualityCompositionUnified.unified_implies_priority
          #print axioms MCore.Real.P02EqualityCompositionUnified.unifiedEqualityProducer
          #print axioms MCore.Real.P02EqualityCompositionUnified.unified_satInP_implies_p_eq_np
          EOF
          lake env lean P02EqualityCompositionUnifiedAudit.lean 2>&1 | tee /tmp/p02-unified.log
          if grep -E 'sorryAx' /tmp/p02-unified.log; then
            echo 'AUDIT_FAIL sorryAx'
            exit 1
          fi
          if grep -En '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' lean/MCore/Real/P02EqualityCompositionUnified.lean; then
            echo 'AUDIT_FAIL source hygiene'
            exit 1
          fi
          cat > P02DeterministicReductionCompositionMaterialAudit.lean <<'EOF'
          import MCore.Real.P02DeterministicReductionCompositionMaterial
          #print axioms MCore.Real.P02DeterministicReductionCompositionMaterial.halting_left
          #print axioms MCore.Real.P02DeterministicReductionCompositionMaterial.halting_right
          #print axioms MCore.Real.P02DeterministicReductionCompositionMaterial.step_left_active
          #print axioms MCore.Real.P02DeterministicReductionCompositionMaterial.bridge_step
          #print axioms MCore.Real.P02DeterministicReductionCompositionMaterial.step_right
          EOF
          lake env lean P02DeterministicReductionCompositionMaterialAudit.lean 2>&1 | tee /tmp/p02-t3.log
          if grep -E 'sorryAx' /tmp/p02-t3.log; then
            echo 'AUDIT_FAIL T3 sorryAx'
            exit 1
          fi
          if grep -En '(^|[[:space:]])(sorry|admit)([[:space:]]|$)|^[[:space:]]*axiom[[:space:]]' lean/MCore/Real/P02DeterministicReductionCompositionMaterial.lean; then
            echo 'AUDIT_FAIL T3 source hygiene'
            exit 1
          fi
          echo P02_EQUALITY_COMPOSITION_UNIFIED_GREEN
          cat > P02TerminalForcingSATAudit.lean <<'EOF'
          import MCore.Real.P02TerminalForcingSAT
          #print axioms MCore.Real.P02TerminalForcingSAT.SATSolverData.toRealization
          #print axioms MCore.Real.P02TerminalForcingSAT.satSolverData_iff_realization
          #print axioms MCore.Real.P02TerminalForcingSAT.satSolverOfData
          EOF
          lake env lean P02TerminalForcingSATAudit.lean 2>&1 | tee /tmp/p02-sat-terminal.log
          if grep -E 'sorryAx' /tmp/p02-sat-terminal.log; then
            echo 'AUDIT_FAIL SAT terminal sorryAx'
            exit 1
          fi
          echo P02_DETERMINISTIC_REDUCTION_COMPOSITION_CORE_GREEN
          echo P02_SAT_TERMINAL_EXPOSED_GREEN
      - name: Force SAT inhabitant
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          if lake env lean probe/P02TerminalSATInhabitantExpectedFailure.lean > /tmp/p02-sat-inhabitant.log 2>&1; then
            echo P02_SAT_INHABITANT_UNEXPECTEDLY_CONSTRUCTED
            cat /tmp/p02-sat-inhabitant.log
            exit 2
          else
            cat /tmp/p02-sat-inhabitant.log
            echo P02_SAT_INHABITANT_STILL_OPEN
          fi
