name: T1D Witness Guess Execution

on:
  push:
    branches:
      - attack/t1d-physical-verifier-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  witness-guess:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Hygiene
        run: |
          set -euo pipefail
          f=lean/MCore/Real/P01WitnessGuessExecution.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"
      - name: Build
        run: lake build MCore.Real.P01WitnessGuessExecution
      - name: Axiom audit
        run: |
          cat >/tmp/WitnessGuessAudit.lean <<'EOF'
          import MCore.Real.P01WitnessGuessExecution
          #print axioms MCore.Real.P01WitnessGuessExecution.witnessGuess_complete
          EOF
          lake env lean /tmp/WitnessGuessAudit.lean 2>&1 | tee /tmp/audit.log
          ! grep -q 'sorryAx' /tmp/audit.log
