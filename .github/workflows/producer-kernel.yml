name: ATK PNP producer kernel

on:
  push:
    branches:
      - atk/pnp-parser-plus-witness-guess-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build exact producer frontier
        run: lake build MCore.Real.CanonicalSATFrameMachineV2 MCore.Real.CanonicalSATSlotParserSpec MCore.Real.CanonicalSATParserMachine MCore.Real.CanonicalSATParserInitProof MCore.Real.CanonicalSATParserHeadProof MCore.Real.CanonicalSATParserWorkScanProof MCore.Real.CanonicalSATParserLeafPopProof MCore.Real.CanonicalSATParserLeafReturnProof MCore.Real.CanonicalSATParserRewindProof MCore.Real.CanonicalSATParserReturnProof MCore.Real.CanonicalSATParserPhaseMacroProof MCore.Real.CanonicalSATParserBinaryHeadProof MCore.Real.CanonicalSATParserTerminalBranches MCore.Real.CanonicalSATRecursiveParserSimulation MCore.Real.P01GlobalParserRuntime MCore.Real.P01GlobalParserBound MCore.Real.CanonicalSATParserNTM MCore.Real.CanonicalSATWitnessGuessNTM MCore.Real.P01WitnessGuessExecution MCore.Real.P01ParserWitnessComposition MCore.Real.P01VerifiedRelation MCore.Real.P01PolynomialBudgetAlgebra MCore.Real.P01FinalCertificate
      - name: Reject proof escapes in producer sources
        run: |
          set -euo pipefail
          PAT='(:=[[:space:]]*sorry([^[:alnum:]_]|$)|by[[:space:]]+sorry([^[:alnum:]_]|$)|^[[:space:]]*sorry([^[:alnum:]_]|$)|(^|[^[:alnum:]_])admit([^[:alnum:]_]|$)|^[[:space:]]*(axiom|constant|constants)[[:space:]])'
          if grep -nE "$PAT" "lean/MCore/Real/CanonicalSATFrameMachineV2.lean" "lean/MCore/Real/CanonicalSATParserMachine.lean" "lean/MCore/Real/CanonicalSATRecursiveParserSimulation.lean" "lean/MCore/Real/P01GlobalParserRuntime.lean" "lean/MCore/Real/P01GlobalParserBound.lean" "lean/MCore/Real/CanonicalSATParserNTM.lean" "lean/MCore/Real/CanonicalSATWitnessGuessNTM.lean" "lean/MCore/Real/P01WitnessGuessExecution.lean" "lean/MCore/Real/P01ParserWitnessComposition.lean" "lean/MCore/Real/P01VerifiedRelation.lean" "lean/MCore/Real/P01FinalCertificate.lean"; then
            echo "producer proof escape found"
            exit 1
          fi
