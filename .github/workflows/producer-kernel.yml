name: ATK PNP producer kernel

on:
  push:
    branches:
      - atk/next-pnp-sat-np-and-universal-failure-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build exact producer frontier
        run: lake build MCore.Real.P02FiniteClockCandidateModel MCore.Real.CanonicalSATParserNTM MCore.Real.CanonicalSATWitnessGuessNTM MCore.Real.CanonicalSATVerifier MCore.Real.P01VerifiedRelation MCore.Real.CanonicalSATNTMAttack
      - name: Reject proof escapes in producer sources
        run: |
          set -euo pipefail
          PAT='(:=[[:space:]]*sorry([^[:alnum:]_]|$)|by[[:space:]]+sorry([^[:alnum:]_]|$)|^[[:space:]]*sorry([^[:alnum:]_]|$)|(^|[^[:alnum:]_])admit([^[:alnum:]_]|$)|^[[:space:]]*(axiom|constant|constants)[[:space:]])'
          if grep -nE "$PAT" "lean/MCore/Real/P02FiniteClockCandidateModel.lean" "lean/MCore/Real/CanonicalSATParserNTM.lean" "lean/MCore/Real/CanonicalSATWitnessGuessNTM.lean" "lean/MCore/Real/CanonicalSATVerifier.lean" "lean/MCore/Real/P01VerifiedRelation.lean" "lean/MCore/Real/CanonicalSATNTMAttack.lean"; then
            echo "producer proof escape found"
            exit 1
          fi
