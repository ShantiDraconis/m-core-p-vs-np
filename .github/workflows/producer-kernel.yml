name: ATK PNP producer kernel

on:
  push:
    branches:
      - atk/next-pnp-t5f-producer-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  producer:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build exact producer frontier
        run: lake build MCore.Real.OpenMathUniversalSeparationLaw MCore.Real.OpenMathCore.T5FBridge MCore.Real.P02DiagonalCompilerFrontierV2 MCore.Real.OpenMathCore.KleeneExtensionalProducer
      - name: Reject proof escapes in producer sources
        run: |
          set -euo pipefail
          PAT='(:=[[:space:]]*sorry([^[:alnum:]_]|$)|by[[:space:]]+sorry([^[:alnum:]_]|$)|^[[:space:]]*sorry([^[:alnum:]_]|$)|(^|[^[:alnum:]_])admit([^[:alnum:]_]|$)|^[[:space:]]*(axiom|constant|constants)[[:space:]])'
          if grep -nE "$PAT" "lean/MCore/Real/OpenMathUniversalSeparationLaw.lean" "lean/MCore/Real/OpenMathCore/T5FBridge.lean" "lean/MCore/Real/P02DiagonalCompilerFrontierV2.lean" "lean/MCore/Real/OpenMathCore/KleeneExtensionalProducer.lean"; then
            echo "producer proof escape found"
            exit 1
          fi
