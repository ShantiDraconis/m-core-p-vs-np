name: T1D Physical Ops

on:
  push:
    branches:
      - attack/t1d-physical-ops-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-ops:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Hygiene
        run: |
          set -euo pipefail
          f=lean/MCore/Real/P01FullVerifierPhysicalOps.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"
      - name: Build
        run: lake build MCore.Real.P01FullVerifierPhysicalOps
      - name: Axiom audit
        run: |
          cat >/tmp/T1DPhysicalOpsAudit.lean <<'EOF'
          import MCore.Real.P01FullVerifierPhysicalOps
          #print axioms MCore.Real.P01FullVerifierPhysicalOps.const_run_real
          #print axioms MCore.Real.P01FullVerifierPhysicalOps.first_operand_pop
          EOF
          lake env lean /tmp/T1DPhysicalOpsAudit.lean 2>&1 | tee /tmp/audit.log
          ! grep -q 'sorryAx' /tmp/audit.log
