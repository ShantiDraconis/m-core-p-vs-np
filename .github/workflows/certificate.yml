name: certificate
on: [push, pull_request]
jobs:
  c9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: Preserve K-chain and C1-C8
        run: lake build MCore.K3 MCore.K4 MCore.K5 MCore.K6 MCore.K7 MCore.K8 MCore.K9 MCore.K10 MCore.PrizeK0 MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC4 MCore.CircuitC5 MCore.CircuitC6 MCore.CircuitC7 MCore.CircuitC8
      - name: Build C9 research layer
        run: lake build MCore.C9.Reuse MCore.C9.Vars MCore.C9.Mu MCore.C9.Good MCore.C9.Step
      - name: Build umbrella target
        run: lake build MCore
      - name: C9 semantic axiom audit
        run: |
          set -euo pipefail
          cat > C9AxiomAudit.lean <<'EOF'
          import MCore.C9.Step
          #print axioms MCore.C9.vars_const
          #print axioms MCore.C9.vars_input
          #print axioms MCore.C9.L1_mu_monotone
          #print axioms MCore.C9.L2_additive
          #print axioms MCore.C9.delta_eq_zero_iff
          #print axioms MCore.C9.delta_pos_iff_strict
          #print axioms MCore.C9.goodTrue_refuted
          #print axioms MCore.C9.stateRank_decreases
          #print axioms MCore.C9.progressStep_no_stutter
          #print axioms MCore.C9.c9_classical_endpoint_not_promoted
          #print axioms MCore.C9.c9_k10_not_promoted
          EOF
          lake env lean C9AxiomAudit.lean 2>&1 | tee C9AxiomAudit.log
          if grep -E 'sorryAx' C9AxiomAudit.log; then exit 1; fi
          if grep -E 'depends on axioms:' C9AxiomAudit.log | grep -Ev '^.*\[(propext|Quot\.sound|Classical\.choice)(, (propext|Quot\.sound|Classical\.choice))*\]$'; then
            echo 'Unexpected axiom dependency outside trusted Lean set'; exit 1
          fi
      - name: C9 variable-count regressions
        run: |
          set -euo pipefail
          cat > C9Vars.lean <<'EOF'
          import MCore.C9.Step
          open MCore MCore.C9 MCore.CircuitK1
          example : vars (Circuit.and (Circuit.input 0) (Circuit.input 0)) = 1 := by native_decide
          example : vars (Circuit.or (Circuit.input 0) (Circuit.input 1)) = 2 := by native_decide
          example : vars (Circuit.not (Circuit.input 7)) = 1 := by native_decide
          EOF
          lake env lean C9Vars.lean
      - name: C9 zero-drop adversary regression
        run: |
          set -euo pipefail
          cat > C9Adversary.lean <<'EOF'
          import MCore.C9.Step
          open MCore MCore.C9
          example : ¬ PositiveOn GoodTrue := goodTrue_refuted
          example : delta CircuitK1.leavesZeroFree CircuitK1.oneInput = 0 := by
            simp [delta, mu, D, CircuitC3.potential, CircuitC2.restrictedSimplified,
              CircuitK1.leavesZeroFree, CircuitK1.oneInput, CircuitK1.restrict,
              CircuitC2.simplify, CircuitK1.μ, CircuitK1.size, CircuitK1.depth]
          EOF
          lake env lean C9Adversary.lean
      - name: C9 rank-descent regression
        run: |
          set -euo pipefail
          cat > C9Rank.lean <<'EOF'
          import MCore.C9.Step
          open MCore MCore.C9 MCore.CircuitK1
          def demoProgressStep : ProgressStep :=
            { before := Circuit.input 0
              after := Circuit.const true
              fixedVars := 1
              fixedVars_le := by native_decide
              vars_after := by native_decide
              mu_nonincrease := by native_decide
              progress := Or.inl (by decide) }
          example : stateRank demoProgressStep.after < stateRank demoProgressStep.before :=
            stateRank_decreases demoProgressStep
          EOF
          lake env lean C9Rank.lean
      - name: C9 epistemic non-promotion
        run: |
          set -euo pipefail
          cat > C9Epistemic.lean <<'EOF'
          import MCore.C9.Step
          open MCore MCore.C9
          example : ¬ Nonempty (ProofCertificate k10_obligation_node) := c9_k10_not_promoted
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := c9_classical_endpoint_not_promoted
          EOF
          lake env lean C9Epistemic.lean
      - name: Clean C9 reproduction
        run: lake clean && lake build MCore.C9.Step && lake build MCore
