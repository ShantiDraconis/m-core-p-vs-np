name: certificate
on: [push, pull_request]

jobs:
  c12:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update

      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi

      - name: Preserve K-chain and C1-C11
        run: |
          set -euo pipefail
          lake build MCore.K3 MCore.K4 MCore.K5 MCore.K6 MCore.K7 MCore.K8 MCore.K9 MCore.K10 MCore.PrizeK0 \
            MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC4 MCore.CircuitC5 \
            MCore.CircuitC6 MCore.CircuitC7 MCore.CircuitC8 \
            MCore.C9.Reuse MCore.C9.Vars MCore.C9.Mu MCore.C9.Good MCore.C9.Step \
            MCore.C10.RestrictionProgress MCore.C11.BranchingCost c11_regression

      - name: Build C12 family layer
        run: |
          set -euo pipefail
          lake build MCore.C12.Families c12_gen

      - name: Build bidirectional structural audit
        run: |
          set -euo pipefail
          lake build MCore.BackwardAudit.ClosedDiscriminant \
            MCore.BackwardAudit.StartToMiddle \
            MCore.BackwardAudit.FinalToMiddle

      - name: Build umbrella target
        run: lake build MCore

      - name: C12 semantic axiom audit
        run: |
          set -euo pipefail
          cat > C12AxiomAudit.lean <<'EOF'
          import MCore.C12.Families
          #print axioms MCore.C12.c12_classical_endpoint_not_promoted
          #print axioms MCore.C12.c12_k10_not_promoted
          EOF
          lake env lean C12AxiomAudit.lean 2>&1 | tee C12AxiomAudit.log
          if grep -E 'sorryAx' C12AxiomAudit.log; then exit 1; fi

      - name: C12 endpoint-language firewall
        run: |
          set -euo pipefail
          if grep -R -n -E 'P_ne_NP|P≠NP|P != NP|P = NP' lean/MCore/C12 lean/C12Gen.lean; then
            echo 'Classical endpoint language is forbidden inside C12'; exit 1
          fi

      - name: Generate C12 distribution
        run: |
          set -euo pipefail
          lake exe c12_gen > distribution.csv
          test "$(wc -l < distribution.csv)" -eq 631
          grep -q '^family,n,k,seed,width,restriction,alpha,beta,' distribution.csv
          grep -q ',true$' distribution.csv
          grep -q ',false$' distribution.csv
          sha256sum distribution.csv | tee distribution.sha256

      - name: Analyze C12 real-data baseline
        run: |
          set -euo pipefail
          python3 audit/analyze_c12.py distribution.csv audit/C12_REAL_DATA_BASELINE.generated.json | tee audit/C12_REAL_DATA_BASELINE.log
          python3 -m json.tool audit/C12_REAL_DATA_BASELINE.generated.json >/dev/null
          grep -q '"data_rows": 630' audit/C12_REAL_DATA_BASELINE.generated.json
          grep -q 'FINITE_DETERMINISTIC_EVIDENCE_ONLY / NO_P_VS_NP_PROMOTION' audit/C12_REAL_DATA_BASELINE.generated.json

      - name: Generate targeted C13 bidirectional probe
        run: |
          set -euo pipefail
          lake build c13_probe
          lake exe c13_probe > c13_probe.csv
          test "$(wc -l < c13_probe.csv)" -eq 1145
          grep -q '^family,n,k,seed,width,restriction,alpha,beta,' c13_probe.csv
          python3 audit/analyze_probe.py c13_probe.csv audit/C13_BIDIRECTIONAL_PROBE.generated.json | tee audit/C13_BIDIRECTIONAL_PROBE.log
          python3 -m json.tool audit/C13_BIDIRECTIONAL_PROBE.generated.json >/dev/null
          grep -q '"data_rows": 1144' audit/C13_BIDIRECTIONAL_PROBE.generated.json
          grep -q 'FINITE_COMPUTATIONAL_EVIDENCE_ONLY / NO_ORIENTATION_OF_D' audit/C13_BIDIRECTIONAL_PROBE.generated.json

      - name: C12 open-obligation and non-promotion firewall
        run: |
          set -euo pipefail
          cat > C12Epistemic.lean <<'EOF'
          import MCore.C12.Families
          open MCore MCore.C10 MCore.C11 MCore.C12
          #check VarsNonincreaseObligation
          #check ProgressCoverageObligation
          #check UniversalPayoffObligation
          #check FamilyPayoffObligation
          example : ¬ Nonempty (ProofCertificate k10_obligation_node) := c12_k10_not_promoted
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := c12_classical_endpoint_not_promoted
          EOF
          lake env lean C12Epistemic.lean

      - name: Backward oracle A-B endpoint test
        run: |
          set -euo pipefail
          lake build MCore.BackwardAudit.HypotheticalClosureOracle MCore.BackwardAudit.WithoutOracle
          if grep -n -E 'HypotheticalClosure|HypotheticalClosureOracle' lean/MCore/BackwardAudit/WithoutOracle.lean; then exit 1; fi
          lake env lean lean/MCore/BackwardAudit/HypotheticalClosureOracle.lean 2>&1 | tee BackwardOracle.log
          lake env lean lean/MCore/BackwardAudit/WithoutOracle.lean 2>&1 | tee BackwardWithout.log
          if grep -F 'sorryAx' BackwardOracle.log BackwardWithout.log; then exit 1; fi
          grep -F "'MCore.BackwardAudit.hypothetical_final' does not depend on any axioms" BackwardOracle.log
          grep -F "'MCore.BackwardAudit.separation_witness_closes' does not depend on any axioms" BackwardWithout.log

      - name: Clean C12 deterministic reproduction
        run: |
          set -euo pipefail
          cp distribution.csv distribution.before.csv
          lake clean
          lake build MCore.C12.Families c12_gen
          lake exe c12_gen > distribution.rebuilt.csv
          cmp distribution.before.csv distribution.rebuilt.csv
          lake build MCore
          sha256sum distribution.rebuilt.csv

      - name: Upload distributions and audit data
        uses: actions/upload-artifact@v4
        with:
          name: pnp-closed-chain-data
          path: |
            distribution.csv
            distribution.sha256
            c13_probe.csv
            audit/C12_REAL_DATA_BASELINE.generated.json
            audit/C13_BIDIRECTIONAL_PROBE.generated.json
            audit/PNP_BIDIRECTIONAL_CLOSED_TEST_MATRIX.json
          if-no-files-found: error

      - name: Backward dense endpoint audit
        run: |
          set -euo pipefail
          python3 -m json.tool audit/PNP_FRONTIERS_SEMANTIC_AUDIT.json >/dev/null
          python3 -m json.tool audit/PNP_THREE_TRACKS_SEMANTIC_AUDIT.json >/dev/null
          python3 -m json.tool audit/PNP_BIDIRECTIONAL_CLOSED_TEST_MATRIX.json >/dev/null

          lake env lean audit/FinalEndpoint.lean 2>&1 | tee audit/FinalEndpoint.log
          lake env lean audit/EndpointCompression.lean 2>&1 | tee audit/EndpointCompression.log
          lake env lean audit/ThreeTracks.lean 2>&1 | tee audit/ThreeTracks.log
          lake env lean audit/ClosedDiscriminant.lean 2>&1 | tee audit/ClosedDiscriminant.log
          lake env lean lean/MCore/BackwardAudit/StartToMiddle.lean 2>&1 | tee audit/StartToMiddle.log
          lake env lean lean/MCore/BackwardAudit/FinalToMiddle.lean 2>&1 | tee audit/FinalToMiddle.log
          lake env lean audit/repro_PNP.lean 2>&1 | tee audit/repro_PNP.log

          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' audit lean/MCore/BackwardAudit; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' audit lean/MCore/BackwardAudit; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -E 'sorryAx' audit/*.log; then exit 1; fi

          python3 - <<'PY'
          from pathlib import Path
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in ["ClosedDiscriminant.log", "StartToMiddle.log", "FinalToMiddle.log"]:
              for line in (Path("audit") / name).read_text().splitlines():
                  marker = "depends on axioms: ["
                  if marker in line:
                      deps = line.split(marker, 1)[1].rsplit("]", 1)[0]
                      got = {x.strip() for x in deps.split(",") if x.strip()}
                      bad = got - allowed
                      if bad:
                          raise SystemExit(f"unexpected axioms in {name}: {sorted(bad)}")
          PY

          grep -q 'MCore.ClosedDiscriminant.closed_chain' audit/ClosedDiscriminant.log
          grep -q 'MCore.ClosedDiscriminant.bidirectional_convergence' audit/ClosedDiscriminant.log
          grep -q 'MCore.ClosedDiscriminant.test_start_to_middle' audit/StartToMiddle.log
          grep -q 'MCore.ClosedDiscriminant.test_final_envelope_to_middle' audit/FinalToMiddle.log
          grep -q 'STRUCTURAL ENVELOPE CLOSED / ORIENTATION UNRESOLVED / NO TARGET CERTIFICATE' audit/PNP_RESIDUE.md
          grep -q 'STATUS: SOURCE_CATALOG_ONLY / NO_MATHEMATICAL_PROMOTION' audit/PUBLIC_AUDIT_MIGRATION_MANIFEST.md
