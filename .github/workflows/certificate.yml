name: certificate
on: [push, pull_request]
jobs:
  circuit-k1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - {name: Preserve certified historical chain, run: 'lake build MCore.K3 && lake build MCore.K4 && lake build MCore.K5 && lake build MCore.K6 && lake build MCore.K7 && lake build MCore.K8 && lake build MCore.K9 && lake build MCore.K10 && lake build MCore.PrizeK0'}
      - {name: Build CIRCUIT-K1 concrete circuit layer, run: 'lake build MCore.CircuitK1'}
      - name: CIRCUIT-K1 semantic axiom closure
        run: |
          printf 'import MCore.CircuitK1\n#print axioms MCore.CircuitK1.size_restrict\n#print axioms MCore.CircuitK1.depth_restrict\n#print axioms MCore.CircuitK1.μ_restrict_invariant\n#print axioms MCore.CircuitK1.raw_potential_does_not_drop\n#print axioms MCore.CircuitK1.k1_classical_endpoint_not_promoted\n#print axioms MCore.CircuitK1.k1_k10_not_promoted\n' > CircuitK1AxiomAudit.lean
          lake env lean CircuitK1AxiomAudit.lean 2>&1 | tee CircuitK1AxiomAudit.log
          grep -F "'MCore.CircuitK1.size_restrict' does not depend on any axioms" CircuitK1AxiomAudit.log
          grep -F "'MCore.CircuitK1.depth_restrict' does not depend on any axioms" CircuitK1AxiomAudit.log
          grep -F "'MCore.CircuitK1.μ_restrict_invariant' does not depend on any axioms" CircuitK1AxiomAudit.log
          grep -F "'MCore.CircuitK1.raw_potential_does_not_drop' does not depend on any axioms" CircuitK1AxiomAudit.log
          grep -F "'MCore.CircuitK1.k1_classical_endpoint_not_promoted' does not depend on any axioms" CircuitK1AxiomAudit.log
          grep -F "'MCore.CircuitK1.k1_k10_not_promoted' does not depend on any axioms" CircuitK1AxiomAudit.log
      - name: CIRCUIT-K1 falsification regression
        run: |
          printf 'import MCore.CircuitK1\nopen MCore MCore.CircuitK1\nexample : μ (restrict fixesZeroTrue oneInput) = μ oneInput := raw_potential_does_not_drop\nexample : ¬ Nonempty (ProofCertificate k10_obligation_node) := k1_k10_not_promoted\n' > CircuitK1Regression.lean
          lake env lean CircuitK1Regression.lean
      - {name: Clean CIRCUIT-K1 reproduction, run: 'lake clean && lake build MCore.CircuitK1 && lake build MCore'}
