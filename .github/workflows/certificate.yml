name: certificate
on: [push, pull_request]
jobs:
  c8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: Preserve C1-C7 and historical chain
        run: lake build MCore.K3 MCore.K4 MCore.K5 MCore.K6 MCore.K7 MCore.K8 MCore.K9 MCore.K10 MCore.PrizeK0 MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC4 MCore.CircuitC5 MCore.CircuitC6 MCore.CircuitC7
      - name: Build C8 recurrence foundation
        run: lake build MCore.CircuitC8
      - name: Build umbrella target
        run: lake build MCore
      - name: C8 axiom audit
        run: |
          set -euo pipefail
          cat > C8AxiomAudit.lean <<'EOF'
          import MCore.CircuitC8
          #print axioms MCore.CircuitC8.size_simplify_le_c8
          #print axioms MCore.CircuitC8.depth_simplify_le_c8
          #print axioms MCore.CircuitC8.potential_simplify_le_c8
          #print axioms MCore.CircuitC8.potential_restrictedSimplified_le
          #print axioms MCore.CircuitC8.restricted_potential_add_drop
          #print axioms MCore.CircuitC8.drop_eq_zero_iff
          #print axioms MCore.CircuitC8.drop_pos_iff_strict
          #print axioms MCore.CircuitC8.rank_decreases_when_variable_fixed
          #print axioms MCore.CircuitC8.rank_decreases_when_potential_drops
          #print axioms MCore.CircuitC8.good_mass_supplies_aggregate_progress
          #print axioms MCore.CircuitC8.zero_is_not_runtime_saving
          #print axioms MCore.CircuitC8.c8_classical_endpoint_not_promoted
          #print axioms MCore.CircuitC8.c8_k10_not_promoted
          EOF
          lake env lean C8AxiomAudit.lean 2>&1 | tee C8AxiomAudit.log
          if grep -E 'sorryAx|Classical.choice' C8AxiomAudit.log; then exit 1; fi
      - name: C8 exact-drop regression
        run: |
          set -euo pipefail
          cat > C8Drop.lean <<'EOF'
          import MCore.CircuitC8
          open MCore MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC8
          example (ρ : Restriction) (c : Circuit) : potential (restrictedSimplified ρ c) ≤ potential c := potential_restrictedSimplified_le ρ c
          example (ρ : Restriction) (c : Circuit) : potential (restrictedSimplified ρ c) + drop ρ c = potential c := restricted_potential_add_drop ρ c
          example (ρ : Restriction) (c : Circuit) : drop ρ c = 0 ↔ potential (restrictedSimplified ρ c) = potential c := drop_eq_zero_iff ρ c
          example (ρ : Restriction) (c : Circuit) : 0 < drop ρ c ↔ StrictDrop ρ c := drop_pos_iff_strict ρ c
          EOF
          lake env lean C8Drop.lean
      - name: C8 recurrence-rank descent
        run: |
          set -euo pipefail
          cat > C8Rank.lean <<'EOF'
          import MCore.CircuitC8
          open MCore.CircuitC8
          example : recurrenceRank (5 - 1) 7 < recurrenceRank 5 7 := rank_decreases_when_variable_fixed 5 7 1 7 (by decide) (by decide) (by decide)
          example : recurrenceRank 5 6 < recurrenceRank 5 7 := rank_decreases_when_potential_drops 5 7 6 (by decide)
          EOF
          lake env lean C8Rank.lean
      - name: C8 runtime-saving firewall
        run: |
          set -euo pipefail
          cat > C8Runtime.lean <<'EOF'
          import MCore.CircuitC8
          open MCore.CircuitC8
          example : ¬ RuntimeSavingWitness 0 := zero_is_not_runtime_saving
          EOF
          lake env lean C8Runtime.lean
      - name: C8 epistemic non-promotion
        run: |
          set -euo pipefail
          cat > C8Epistemic.lean <<'EOF'
          import MCore.CircuitC8
          open MCore MCore.CircuitC8
          example : ¬ Nonempty (ProofCertificate k10_obligation_node) := c8_k10_not_promoted
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := c8_classical_endpoint_not_promoted
          EOF
          lake env lean C8Epistemic.lean
      - name: Clean C8 reproduction
        run: lake clean && lake build MCore.CircuitC8 && lake build MCore
