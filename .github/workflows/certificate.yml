name: certificate
on: [push, pull_request]

jobs:
  c12:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1

      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update

      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi

      - name: Preserve K-chain and C1-C11
        run: |
          set -euo pipefail
          lake build MCore.K3 MCore.K4 MCore.K5 MCore.K6 MCore.K7 MCore.K8 MCore.K9 MCore.K10 MCore.PrizeK0 \
            MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC4 MCore.CircuitC5 \
            MCore.CircuitC6 MCore.CircuitC7 MCore.CircuitC8 \
            MCore.C9.Reuse MCore.C9.Vars MCore.C9.Mu MCore.C9.Good MCore.C9.Step \
            MCore.C10.RestrictionProgress MCore.C11.BranchingCost c11_regression

      - name: Build C12 family layer
        run: |
          set -euo pipefail
          lake build MCore.C12.Families c12_gen

      - name: Targeted build MCore.Real.CNFStructure
        run: |
          set -euo pipefail
          mkdir -p audit
          lake build MCore.Real.CNFStructure 2>&1 | tee audit/PNP-CNFStructure-targeted.log

      - name: Targeted build MCore.Real.Semantics
        run: |
          set -euo pipefail
          lake build MCore.Real.Semantics 2>&1 | tee audit/PNP-Semantics-targeted.log

      - name: Axiom audit Semantics
        run: |
          set -euo pipefail
          cat > SemanticsAxiomAudit.lean <<'EOF'
          import MCore.Real.Semantics
          #print axioms MCore.Real.semanticallyEquivalent_refl
          #print axioms MCore.Real.semanticallyRepresents_of_parse_eq
          #print axioms MCore.Real.semanticallyRepresents_has_parse
          #print axioms MCore.Real.semanticallyRepresents_eval
          EOF
          lake env lean SemanticsAxiomAudit.lean 2>&1 | tee audit/PNP-Semantics-axioms.log

      - name: Targeted build MCore.Real.SATMachine
        run: |
          set -euo pipefail
          lake build MCore.Real.SATMachine 2>&1 | tee audit/PNP-SATMachine-targeted.log

      - name: Axiom audit SATMachine interface
        run: |
          set -euo pipefail
          cat > SATMachineAxiomAudit.lean <<'EOF'
          import MCore.Real.SATMachine
          #print axioms MCore.Real.satMachineRealization_starts_initial
          #print axioms MCore.Real.satMachineRealization_decides
          EOF
          lake env lean SATMachineAxiomAudit.lean 2>&1 | tee audit/PNP-SATMachine-axioms.log

      - name: Targeted build MCore.Real.FinalProof
        run: |
          set -euo pipefail
          lake build MCore.Real.FinalProof 2>&1 | tee audit/PNP-FinalProof-targeted.log

      - name: Hardened canonical final-proof model
        run: |
          set -euo pipefail
          lake build MCore.Real.CanonicalFinalProof 2>&1 | tee audit/PNP-CanonicalFinalProof-targeted.log

      - name: Axiom audit hardened canonical endpoint
        run: |
          set -euo pipefail
          cat > CanonicalFinalProofAxiomAudit.lean <<'EOF'
          import MCore.Real.CanonicalFinalProof
          #print axioms MCore.Real.CanonicalFinalProof.universal_failure_implies_not_in_p
          #print axioms MCore.Real.CanonicalFinalProof.not_in_p_implies_universal_failure
          #print axioms MCore.Real.CanonicalFinalProof.universal_failure_iff_not_in_p
          #print axioms MCore.Real.CanonicalFinalProof.target_failure_implies_p_ne_np
          #print axioms MCore.Real.CanonicalFinalProof.separation_certificate_closes
          EOF
          lake env lean CanonicalFinalProofAxiomAudit.lean 2>&1 | tee audit/PNP-CanonicalFinalProof-axioms.log
          if grep -E 'sorryAx' audit/PNP-CanonicalFinalProof-axioms.log; then exit 1; fi

      - name: Build canonical P subset NP embedding
        run: |
          set -euo pipefail
          lake build MCore.Real.CanonicalPSubsetNP MCore.Real.CanonicalComplexityBridge 2>&1 | tee audit/PNP-CanonicalPSubsetNP-targeted.log

      - name: Axiom audit canonical P subset NP embedding
        run: |
          set -euo pipefail
          cat > CanonicalPSubsetNPAxiomAudit.lean <<'EOF'
          import MCore.Real.CanonicalPSubsetNP
          import MCore.Real.CanonicalComplexityBridge
          #print axioms MCore.Real.CanonicalPSubsetNP.accept_or_reject_eq_halting
          #print axioms MCore.Real.CanonicalPSubsetNP.runBranches_to_tm_run
          #print axioms MCore.Real.CanonicalPSubsetNP.correctAt_to_ntm
          #print axioms MCore.Real.CanonicalPSubsetNP.inP_subset_inNP
          #print axioms MCore.Real.CanonicalComplexityBridge.canonical_failure_witness_separates_legacy_interface
          EOF
          lake env lean CanonicalPSubsetNPAxiomAudit.lean 2>&1 | tee audit/PNP-CanonicalPSubsetNP-axioms.log
          if grep -E 'sorryAx' audit/PNP-CanonicalPSubsetNP-axioms.log; then exit 1; fi

      - name: Build all-gap fail-proof compression
        run: |
          set -euo pipefail
          lake build MCore.Real.FailProofAllGaps \
            MCore.Real.FailProofFiniteAttack \
            MCore.Real.CanonicalSATBoundary 2>&1 | tee audit/PNP-FailProof-AllGaps-targeted.log

      - name: Axiom audit all-gap fail-proof compression
        run: |
          set -euo pipefail
          cat > FailProofAllGapsAxiomAudit.lean <<'EOF'
          import MCore.Real.FailProofAllGaps
          import MCore.Real.FailProofFiniteAttack
          import MCore.Real.CanonicalSATBoundary
          #print axioms MCore.Real.FailProofAllGaps.failure_generator_implies_universal_failure
          #print axioms MCore.Real.FailProofAllGaps.failureGeneratorOfUniversalFailure
          #print axioms MCore.Real.FailProofAllGaps.final_gap_certificate_closes
          #print axioms MCore.Real.FailProofFiniteAttack.finite_to_universal_principle_refuted
          #print axioms MCore.Real.CanonicalSATBoundary.encoded_sat_iff
          #print axioms MCore.Real.CanonicalSATBoundary.sat_external_closure_implies_official_separation
          EOF
          lake env lean FailProofAllGapsAxiomAudit.lean 2>&1 | tee audit/PNP-FailProof-AllGaps-axioms.log
          if grep -E 'sorryAx' audit/PNP-FailProof-AllGaps-axioms.log; then exit 1; fi

      - name: Build canonical Circuit bit encoding
        run: |
          set -euo pipefail
          lake build MCore.Real.CanonicalCircuitBits MCore.Real.CanonicalSATWitness MCore.Real.CanonicalSATVerifier 2>&1 | tee audit/PNP-CanonicalCircuitBits-targeted.log

      - name: Axiom audit canonical Circuit bit encoding
        run: |
          set -euo pipefail
          cat > CanonicalCircuitBitsAxiomAudit.lean <<'EOF'
          import MCore.Real.CanonicalCircuitBits
          import MCore.Real.CanonicalSATWitness
          import MCore.Real.CanonicalSATVerifier
          #print axioms MCore.Real.CanonicalCircuitBits.decodeNat_encodeNat_append
          #print axioms MCore.Real.CanonicalCircuitBits.size_le_encodeCircuit_length
          #print axioms MCore.Real.CanonicalCircuitBits.decodeCircuitCore_encode_append
          #print axioms MCore.Real.CanonicalCircuitBits.decodeCircuit_encode
          #print axioms MCore.Real.CanonicalCircuitBits.canonical_sat_encoding_closed
          #print axioms MCore.Real.CanonicalCircuitBits.encoded_sat_equivalence
          #print axioms MCore.Real.CanonicalSATWitness.satLanguage_iff_exists_finite_witness
          #print axioms MCore.Real.CanonicalSATWitness.varBound_le_encoded_length
          #print axioms MCore.Real.CanonicalSATWitness.witness_bits_linear_bound
          #print axioms MCore.Real.CanonicalSATVerifier.verifyWitness_correct
          #print axioms MCore.Real.CanonicalSATVerifier.verificationCost_linear_encoding_bound
          #print axioms MCore.Real.CanonicalSATVerifier.sat_has_short_verified_witness
          EOF
          lake env lean CanonicalCircuitBitsAxiomAudit.lean 2>&1 | tee audit/PNP-CanonicalCircuitBits-axioms.log
          if grep -E 'sorryAx' audit/PNP-CanonicalCircuitBits-axioms.log; then exit 1; fi

      - name: Build P01 evalStep physical refinement
        run: |
          set -euo pipefail
          lake build MCore.Real.P01EvalStepFrameRefinement 2>&1 | tee audit/P01-EvalStepFrameRefinement-targeted.log

      - name: Build P01 preserving unary reader frontier
        run: |
          set -euo pipefail
          lake build MCore.Real.P01PreservingUnaryWitnessMarker \
            MCore.Real.P01InputNodePreservingPlan \
            MCore.Real.P01PreservingUnaryWitnessMachine \
            MCore.Real.P01PreservingUnaryPhysicalAdvance \
            MCore.Real.P01PreservingUnaryReaderCertificate \
            MCore.Real.P01PreservingMarkerIteration 2>&1 | tee audit/P01-PreservingUnaryReader-targeted.log

      - name: Axiom audit P01 preserving unary reader frontier
        run: |
          set -euo pipefail
          cat > P01PreservingUnaryReaderAudit.lean <<'EOF'
          import MCore.Real.P01PreservingUnaryWitnessMarker
          import MCore.Real.P01InputNodePreservingPlan
          import MCore.Real.P01PreservingUnaryWitnessMachine
          import MCore.Real.P01PreservingUnaryPhysicalAdvance
          import MCore.Real.P01PreservingUnaryReaderCertificate
          import MCore.Real.P01PreservingMarkerIteration
          #print axioms MCore.Real.P01PreservingUnaryWitnessMarker.marker_tape_roundTrip
          #print axioms MCore.Real.P01InputNodePreservingPlan.evalStep_input_encoded
          #print axioms MCore.Real.P01PreservingUnaryWitnessMachine.preservingRead_first_true_cycle
          #print axioms MCore.Real.P01PreservingUnaryWitnessMachine.preservingRead_zero_correct
          #print axioms MCore.Real.P01PreservingUnaryReaderCertificate.input_semantic_from_reader_bit
          #print axioms MCore.Real.P01PreservingMarkerIteration.advanceN_exposes_getD
          EOF
          lake env lean P01PreservingUnaryReaderAudit.lean 2>&1 | tee audit/P01-PreservingUnaryReader-axioms.log
          if grep -E 'sorryAx' audit/P01-PreservingUnaryReader-axioms.log; then exit 1; fi

      - name: Axiom audit P01 evalStep physical refinement
        run: |
          set -euo pipefail
          cat > P01EvalStepFrameRefinementAudit.lean <<'EOF'
          import MCore.Real.P01EvalStepFrameRefinement
          #print axioms MCore.Real.P01EvalStepFrameRefinement.push_refines_frame_cons
          #print axioms MCore.Real.P01EvalStepFrameRefinement.pop_refines_frame_tail
          #print axioms MCore.Real.P01EvalStepFrameRefinement.evalStep_not_tag_refined
          #print axioms MCore.Real.P01EvalStepFrameRefinement.evalStep_and_tag_refined
          #print axioms MCore.Real.P01EvalStepFrameRefinement.evalStep_or_tag_refined
          #print axioms MCore.Real.P01EvalStepFrameRefinement.evalStep_neg_return_refined
          #print axioms MCore.Real.P01EvalStepFrameRefinement.evalStep_andLeft_return_refined
          #print axioms MCore.Real.P01EvalStepFrameRefinement.evalStep_orLeft_return_refined
          #print axioms MCore.Real.P01EvalStepFrameRefinement.evalStep_andRight_return_refined
          #print axioms MCore.Real.P01EvalStepFrameRefinement.evalStep_orRight_return_refined
          EOF
          lake env lean P01EvalStepFrameRefinementAudit.lean 2>&1 | tee audit/P01-EvalStepFrameRefinement-axioms.log
          if grep -E 'sorryAx' audit/P01-EvalStepFrameRefinement-axioms.log; then exit 1; fi

      - name: Reproduce C12 semantic-proxy counterexample
        run: |
          set -euo pipefail
          lake env lean audit/C12/SRepresentationCounterexample.lean 2>&1 | tee audit/PNP-C12-SemanticCounterexample.log
          if grep -E 'sorryAx' audit/PNP-C12-SemanticCounterexample.log; then exit 1; fi
          grep -q 'direct_potential_semantic_identification_refuted' audit/PNP-C12-SemanticCounterexample.log

      - name: RED attack arbitrary-encode loophole
        run: |
          set -euo pipefail
          lake build MCore.Real.FinalProofAttack 2>&1 | tee audit/PNP-FinalProofAttack-targeted.log

      - name: Axiom audit final-proof attack
        run: |
          set -euo pipefail
          cat > FinalProofAttackAxiomAudit.lean <<'EOF'
          import MCore.Real.FinalProofAttack
          #print axioms MCore.Real.FinalProofAttack.smuggledCandidate_correct
          #print axioms MCore.Real.FinalProofAttack.every_language_inP_under_arbitrary_encode
          #print axioms MCore.Real.FinalProofAttack.current_SATNotInP_refuted
          #print axioms MCore.Real.FinalProofAttack.current_UniversalSATFailure_refuted
          #print axioms MCore.Real.FinalProofAttack.current_SATLowerBoundCertificate_refuted
          EOF
          lake env lean FinalProofAttackAxiomAudit.lean 2>&1 | tee audit/PNP-FinalProofAttack-axioms.log
          if grep -E 'sorryAx' audit/PNP-FinalProofAttack-axioms.log; then exit 1; fi

      - name: Axiom audit direct final-proof compression
        run: |
          set -euo pipefail
          cat > FinalProofAxiomAudit.lean <<'EOF'
          import MCore.Real.FinalProof
          #print axioms MCore.Real.universal_sat_failure_implies_sat_not_in_p
          #print axioms MCore.Real.sat_not_in_p_implies_universal_sat_failure
          #print axioms MCore.Real.universal_sat_failure_iff_sat_not_in_p
          #print axioms MCore.Real.sat_not_in_p_of_lower_bound_certificate
          #print axioms MCore.Real.sat_boundary_implies_machine_p_ne_np
          #print axioms MCore.Real.sat_certificate_implies_machine_p_ne_np
          #print axioms MCore.Real.final_proof_from_residual
          EOF
          lake env lean FinalProofAxiomAudit.lean 2>&1 | tee audit/PNP-FinalProof-axioms.log
          if grep -E 'sorryAx' audit/PNP-FinalProof-axioms.log; then exit 1; fi

      - name: Axiom audit CNFStructure
        run: |
          set -euo pipefail
          cat > CNFStructureAxiomAudit.lean <<'EOF'
          import MCore.Real.CNFStructure
          #print axioms MCore.Real.IsLiteral
          #print axioms MCore.Real.IsClause
          #print axioms MCore.Real.IsCNF
          #print axioms MCore.Real.IsClause_or
          #print axioms MCore.Real.IsCNF_and
          #print axioms MCore.Real.literalAt_isLiteral
          #print axioms MCore.Real.isLiteral_isClause
          #print axioms MCore.Real.literalAt_isClause
          #print axioms MCore.Real.foldl_or_preserves_isClause
          #print axioms MCore.Real.randomClause_isClause
          #print axioms MCore.Real.isClause_isCNF
          #print axioms MCore.Real.randomClause_isCNF
          #print axioms MCore.Real.foldl_and_preserves_isCNF
          #print axioms MCore.Real.randomKCNF_isCNF
          #print axioms MCore.Real.renderCNF
          #print axioms MCore.Real.WellFormedCNFString
          #print axioms MCore.Real.wellFormed_of_render
          #print axioms MCore.Real.charToDigit?
          #print axioms MCore.Real.parseNatChars
          #print axioms MCore.Real.parseCircuitChars
          #print axioms MCore.Real.parseCNF
          #print axioms MCore.Real.bool_and_eq_true_iff
          #print axioms MCore.Real.bool_and_decide_eq_true_iff
          #print axioms MCore.Real.isClauseBool
          #print axioms MCore.Real.isCNFBool
          #print axioms MCore.Real.isClauseBool_eq_true_iff
          #print axioms MCore.Real.isCNFBool_eq_true_iff
          EOF
          lake env lean CNFStructureAxiomAudit.lean 2>&1 | tee audit/PNP-CNFStructure-axioms-targeted.log
          if grep -E 'sorryAx' audit/PNP-CNFStructure-axioms-targeted.log; then exit 1; fi

      - name: Build bidirectional structural audit
        run: |
          set -euo pipefail
          lake build MCore.BackwardAudit.ClosedDiscriminant \
            MCore.BackwardAudit.StartToMiddle \
            MCore.BackwardAudit.FinalToMiddle \
            MCore.BackwardAudit.OrientedWitnessBoundary \
            MCore.BackwardAudit.OrientedWitnessBoundary

      - name: C12 semantic axiom audit
        run: |
          set -euo pipefail
          cat > C12AxiomAudit.lean <<'EOF'
          import MCore.C12.Families
          #print axioms MCore.C12.c12_classical_endpoint_not_promoted
          #print axioms MCore.C12.c12_k10_not_promoted
          EOF
          lake env lean C12AxiomAudit.lean 2>&1 | tee C12AxiomAudit.log
          if grep -E 'sorryAx' C12AxiomAudit.log; then exit 1; fi

      - name: C12 endpoint-language firewall
        run: |
          set -euo pipefail
          if grep -R -n -E 'P_ne_NP|P≠NP|P != NP|P = NP' lean/MCore/C12 lean/C12Gen.lean; then
            echo 'Classical endpoint language is forbidden inside C12'; exit 1
          fi

      - name: Generate C12 distribution
        run: |
          set -euo pipefail
          lake exe c12_gen > distribution.csv
          test "$(wc -l < distribution.csv)" -eq 631
          grep -q '^family,n,k,seed,width,restriction,alpha,beta,' distribution.csv
          grep -q ',true$' distribution.csv
          grep -q ',false$' distribution.csv
          sha256sum distribution.csv | tee distribution.sha256

      - name: Analyze C12 real-data baseline
        run: |
          set -euo pipefail
          python3 audit/analyze_c12.py distribution.csv audit/C12_REAL_DATA_BASELINE.generated.json | tee audit/C12_REAL_DATA_BASELINE.log
          python3 -m json.tool audit/C12_REAL_DATA_BASELINE.generated.json >/dev/null
          grep -q '"data_rows": 630' audit/C12_REAL_DATA_BASELINE.generated.json
          grep -q 'FINITE_DETERMINISTIC_EVIDENCE_ONLY / NO_P_VS_NP_PROMOTION' audit/C12_REAL_DATA_BASELINE.generated.json

      - name: Generate targeted C13 bidirectional probe
        run: |
          set -euo pipefail
          lake build c13_probe
          lake exe c13_probe > c13_probe.csv
          test "$(wc -l < c13_probe.csv)" -eq 1145
          grep -q '^family,n,k,seed,width,restriction,alpha,beta,' c13_probe.csv
          python3 audit/analyze_probe.py c13_probe.csv audit/C13_BIDIRECTIONAL_PROBE.generated.json | tee audit/C13_BIDIRECTIONAL_PROBE.log
          python3 -m json.tool audit/C13_BIDIRECTIONAL_PROBE.generated.json >/dev/null
          grep -q '"data_rows": 1144' audit/C13_BIDIRECTIONAL_PROBE.generated.json
          grep -q 'FINITE_COMPUTATIONAL_EVIDENCE_ONLY / NO_ORIENTATION_OF_D' audit/C13_BIDIRECTIONAL_PROBE.generated.json

      - name: C12 open-obligation and non-promotion firewall
        run: |
          set -euo pipefail
          cat > C12Epistemic.lean <<'EOF'
          import MCore.C12.Families
          open MCore MCore.C10 MCore.C11 MCore.C12
          #check VarsNonincreaseObligation
          #check ProgressCoverageObligation
          #check UniversalPayoffObligation
          #check FamilyPayoffObligation
          example : ¬ Nonempty (ProofCertificate k10_obligation_node) := c12_k10_not_promoted
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := c12_classical_endpoint_not_promoted
          EOF
          lake env lean C12Epistemic.lean

      - name: Backward oracle A-B endpoint test
        run: |
          set -euo pipefail
          lake build MCore.BackwardAudit.HypotheticalClosureOracle MCore.BackwardAudit.WithoutOracle
          if grep -n -E 'HypotheticalClosure|HypotheticalClosureOracle' lean/MCore/BackwardAudit/WithoutOracle.lean; then exit 1; fi
          lake env lean lean/MCore/BackwardAudit/HypotheticalClosureOracle.lean 2>&1 | tee BackwardOracle.log
          lake env lean lean/MCore/BackwardAudit/WithoutOracle.lean 2>&1 | tee BackwardWithout.log
          if grep -F 'sorryAx' BackwardOracle.log BackwardWithout.log; then exit 1; fi
          grep -F "'MCore.BackwardAudit.hypothetical_final' does not depend on any axioms" BackwardOracle.log
          grep -F "'MCore.BackwardAudit.separation_witness_closes' does not depend on any axioms" BackwardWithout.log

      - name: Upload distributions and audit data
        uses: actions/upload-artifact@v4
        with:
          name: pnp-closed-chain-data
          path: |
            distribution.csv
            distribution.sha256
            c13_probe.csv
            audit/C12_REAL_DATA_BASELINE.generated.json
            audit/C13_BIDIRECTIONAL_PROBE.generated.json
            audit/PNP_BIDIRECTIONAL_CLOSED_TEST_MATRIX.json
          if-no-files-found: error

      - name: Backward dense endpoint audit
        run: |
          set -euo pipefail
          python3 -m json.tool audit/PNP_FRONTIERS_SEMANTIC_AUDIT.json >/dev/null
          python3 -m json.tool audit/PNP_THREE_TRACKS_SEMANTIC_AUDIT.json >/dev/null
          python3 -m json.tool audit/PNP_BIDIRECTIONAL_CLOSED_TEST_MATRIX.json >/dev/null

          lake build MCore.BackwardAudit.ClosedDiscriminant \
            MCore.BackwardAudit.StartToMiddle \
            MCore.BackwardAudit.FinalToMiddle \
            MCore.BackwardAudit.OrientedWitnessBoundary

          lake env lean audit/FinalEndpoint.lean 2>&1 | tee audit/FinalEndpoint.log
          lake env lean audit/EndpointCompression.lean 2>&1 | tee audit/EndpointCompression.log
          lake env lean audit/ThreeTracks.lean 2>&1 | tee audit/ThreeTracks.log
          lake env lean audit/ClosedDiscriminant.lean 2>&1 | tee audit/ClosedDiscriminant.log
          lake env lean lean/MCore/BackwardAudit/StartToMiddle.lean 2>&1 | tee audit/StartToMiddle.log
          lake env lean lean/MCore/BackwardAudit/FinalToMiddle.lean 2>&1 | tee audit/FinalToMiddle.log
          lake env lean lean/MCore/BackwardAudit/OrientedWitnessBoundary.lean 2>&1 | tee audit/OrientedWitnessBoundary.log
          lake env lean audit/ATK_LOWER_BOUND_WITNESS_MODEL_BINDING_COUNTERAUDIT.lean 2>&1 | tee audit/LowerBoundWitnessModelBinding.log
          lake env lean audit/repro_PNP.lean 2>&1 | tee audit/repro_PNP.log

          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' audit lean/MCore/BackwardAudit; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' audit lean/MCore/BackwardAudit; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -E 'sorryAx' audit/*.log; then exit 1; fi
          grep -q "MCore.BackwardAudit.typeA_closes_equality" audit/OrientedWitnessBoundary.log
          grep -q "MCore.BackwardAudit.typeB_closes_separation" audit/OrientedWitnessBoundary.log
          grep -q "MCore.BackwardAudit.oriented_material_closes_terminal" audit/OrientedWitnessBoundary.log

          python3 - <<'PY'
          from pathlib import Path
          allowed = {"propext", "Classical.choice", "Quot.sound"}
          for name in ["ClosedDiscriminant.log", "StartToMiddle.log", "FinalToMiddle.log"]:
              for line in (Path("audit") / name).read_text().splitlines():
                  marker = "depends on axioms: ["
                  if marker in line:
                      deps = line.split(marker, 1)[1].rsplit("]", 1)[0]
                      got = {x.strip() for x in deps.split(",") if x.strip()}
                      bad = got - allowed
                      if bad:
                          raise SystemExit(f"unexpected axioms in {name}: {sorted(bad)}")
          PY

          grep -q 'MCore.ClosedDiscriminant.closed_chain' audit/ClosedDiscriminant.log
          grep -q 'MCore.ClosedDiscriminant.bidirectional_convergence' audit/ClosedDiscriminant.log
          grep -q 'MCore.ClosedDiscriminant.test_start_to_middle' audit/StartToMiddle.log
          grep -q 'MCore.ClosedDiscriminant.test_final_envelope_to_middle' audit/FinalToMiddle.log
          grep -q 'STRUCTURAL ENVELOPE CLOSED / ORIENTATION UNRESOLVED / NO TARGET CERTIFICATE' audit/PNP_RESIDUE.md
          grep -q 'STATUS: SOURCE_CATALOG_ONLY / NO_MATHEMATICAL_PROMOTION' audit/PUBLIC_AUDIT_MIGRATION_MANIFEST.md
