name: certificate
on: [push, pull_request]
jobs:
  k8:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - {name: Preserve K3-K7, run: 'lake build MCore.K3 && lake build MCore.K4 && lake build MCore.K5 && lake build MCore.K6 && lake build MCore.K7'}
      - {name: Build K8 internal algebra, run: 'lake build MCore.K8'}
      - name: K8 semantic axiom closure
        run: |
          printf 'import MCore.K8\n#print axioms MCore.ComplexityDecomposition.reconstruct_eq\n#print axioms MCore.ComplexityDecomposition.ext_components\n#print axioms MCore.ComplexityDecomposition.projection_injective\n#print axioms MCore.k8_statement_valid\n#print axioms MCore.k8_status_openBridge\n#print axioms MCore.k8_not_certified\n#print axioms MCore.k8_classical_endpoint_not_promoted\n' > K8AxiomAudit.lean
          lake env lean K8AxiomAudit.lean 2>&1 | tee K8AxiomAudit.log
          grep -F "'MCore.ComplexityDecomposition.reconstruct_eq' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.ComplexityDecomposition.ext_components' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.ComplexityDecomposition.projection_injective' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.k8_statement_valid' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.k8_status_openBridge' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.k8_not_certified' does not depend on any axioms" K8AxiomAudit.log
          grep -F "'MCore.k8_classical_endpoint_not_promoted' does not depend on any axioms" K8AxiomAudit.log
      - name: Negative K8 promotion regression
        run: |
          printf 'import MCore.K8\nopen MCore\nexample : ¬ Nonempty (ProofCertificate k8_internal_node) := k8_not_certified\nexample : ¬ Nonempty (ProofCertificate k6_dependency.target) := k8_classical_endpoint_not_promoted\n' > NegativeK8.lean
          lake env lean NegativeK8.lean
      - {name: Clean K8 reproduction, run: 'lake clean && lake build MCore.K8 && lake build MCore'}
