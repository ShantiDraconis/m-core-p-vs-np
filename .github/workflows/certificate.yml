name: certificate
on: [push, pull_request]
jobs:
  k7:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - {name: Preserve K3-K6, run: 'lake build MCore.K3 && lake build MCore.K4 && lake build MCore.K5 && lake build MCore.K6'}
      - {name: Build K7 decomposition, run: 'lake build MCore.K7'}
      - name: K7 semantic axiom closure
        run: |
          printf 'import MCore.K7\n#print axioms MCore.ComplexityDecomposition.projectReal_mk\n#print axioms MCore.ComplexityDecomposition.projectImag_mk\n#print axioms MCore.ComplexityDecomposition.projectIndeterminate_mk\n#print axioms MCore.k7_status_openBridge\n#print axioms MCore.k7_not_certified\n' > K7AxiomAudit.lean
          lake env lean K7AxiomAudit.lean 2>&1 | tee K7AxiomAudit.log
          grep -F "does not depend on any axioms" K7AxiomAudit.log
      - name: Negative K7 promotion regression
        run: |
          printf 'import MCore.K7\nopen MCore\nexample : ¬ Nonempty (ProofCertificate k7_decomposition_node) := k7_not_certified\n' > NegativeK7.lean
          lake env lean NegativeK7.lean
      - {name: Clean K7 reproduction, run: 'lake clean && lake build MCore.K7 && lake build MCore'}
