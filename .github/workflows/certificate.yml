name: certificate
on: [push, pull_request]
jobs:
  c5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: Preserve C1 C2 C3 C4 and historical chain
        run: lake build MCore.K3 MCore.K4 MCore.K5 MCore.K6 MCore.K7 MCore.K8 MCore.K9 MCore.K10 MCore.PrizeK0 MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC4
      - name: Build C5 structural family layer
        run: lake build MCore.CircuitC5
      - name: C5 axiom audit
        run: |
          set -euo pipefail
          printf 'import MCore.CircuitC5\n#print axioms MCore.CircuitC5.member_contribution_le_weightedDrop\n#print axioms MCore.CircuitC5.positive_witness_implies_weightedDrop_positive\n#print axioms MCore.CircuitC5.demo_positive_from_structural_condition\n#print axioms MCore.CircuitC5.zero_sample_has_no_positive_witness\n#print axioms MCore.CircuitC5.not_every_family_has_positive_witness\n#print axioms MCore.CircuitC5.c5_k10_not_promoted\n' > C5AxiomAudit.lean
          lake env lean C5AxiomAudit.lean 2>&1 | tee C5AxiomAudit.log
          if grep -E 'sorryAx|Classical.choice' C5AxiomAudit.log; then exit 1; fi
      - name: C5 structural sufficient-condition regression
        run: |
          printf 'import MCore.CircuitC5\nopen MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC4 MCore.CircuitC5\nexample : PositiveDropWitness demoSample reducibleExample := demoPositiveWitness\nexample : 0 < weightedDrop demoSample reducibleExample := demo_positive_from_structural_condition\n' > C5Positive.lean
          lake env lean C5Positive.lean
      - name: C5 zero-family adversary
        run: |
          printf 'import MCore.CircuitC5\nopen MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC4 MCore.CircuitC5\nexample : ¬ PositiveDropWitness zeroDropSample oneInput := zero_sample_has_no_positive_witness\nexample : ¬ (∀ (sample : List WeightedRestriction) (c : Circuit), 0 < totalWeight sample → PositiveDropWitness sample c) := not_every_family_has_positive_witness\n' > C5Adversary.lean
          lake env lean C5Adversary.lean
      - name: C5 epistemic non-promotion
        run: |
          printf 'import MCore.CircuitC5\nopen MCore MCore.CircuitC5\nexample : ¬ Nonempty (ProofCertificate k10_obligation_node) := c5_k10_not_promoted\n' > C5Epistemic.lean
          lake env lean C5Epistemic.lean
      - name: Clean C5 reproduction
        run: lake clean && lake build MCore.CircuitC5 && lake build MCore
