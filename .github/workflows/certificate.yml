name: certificate
on: [push, pull_request]
jobs:
  k9:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - {name: Preserve K3-K8, run: 'lake build MCore.K3 && lake build MCore.K4 && lake build MCore.K5 && lake build MCore.K6 && lake build MCore.K7 && lake build MCore.K8'}
      - {name: Build K9 classical interface, run: 'lake build MCore.K9'}
      - name: K9 semantic axiom closure
        run: |
          printf 'import MCore.K9\n#print axioms MCore.obstruction_excludes_P\n#print axioms MCore.witness_separates_classes\n#print axioms MCore.k9_statement_valid\n#print axioms MCore.k9_status_openBridge\n#print axioms MCore.k9_not_certified\n#print axioms MCore.k9_classical_endpoint_not_promoted\n' > K9AxiomAudit.lean
          lake env lean K9AxiomAudit.lean 2>&1 | tee K9AxiomAudit.log
          grep -F "'MCore.obstruction_excludes_P' does not depend on any axioms" K9AxiomAudit.log
          grep -F "'MCore.witness_separates_classes' does not depend on any axioms" K9AxiomAudit.log
          grep -F "'MCore.k9_statement_valid' does not depend on any axioms" K9AxiomAudit.log
          grep -F "'MCore.k9_status_openBridge' does not depend on any axioms" K9AxiomAudit.log
          grep -F "'MCore.k9_not_certified' does not depend on any axioms" K9AxiomAudit.log
          grep -F "'MCore.k9_classical_endpoint_not_promoted' does not depend on any axioms" K9AxiomAudit.log
      - name: Negative K9 promotion regression
        run: |
          printf 'import MCore.K9\nopen MCore\nexample : ¬ Nonempty (ProofCertificate k9_classical_interface_node) := k9_not_certified\nexample : ¬ Nonempty (ProofCertificate k6_dependency.target) := k9_classical_endpoint_not_promoted\n' > NegativeK9.lean
          lake env lean NegativeK9.lean
      - {name: Clean K9 reproduction, run: 'lake clean && lake build MCore.K9 && lake build MCore'}
