name: certificate
on: [push, pull_request]
jobs:
  c3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: Preserve C1 C2 and historical chain
        run: lake build MCore.K3 MCore.K4 MCore.K5 MCore.K6 MCore.K7 MCore.K8 MCore.K9 MCore.K10 MCore.PrizeK0 MCore.CircuitK1 MCore.CircuitC2
      - name: Build C3 quantitative layer
        run: lake build MCore.CircuitC3
      - name: C3 axiom audit
        run: |
          set -euo pipefail
          printf 'import MCore.CircuitC3\n#print axioms MCore.CircuitC3.reducibleExample_strict_potential_drop\n#print axioms MCore.CircuitC3.reducibleExample_drop_exact\n#print axioms MCore.CircuitC3.free_oneInput_drop_zero\n#print axioms MCore.CircuitC3.not_every_restriction_strictly_drops\n#print axioms MCore.CircuitC3.c3_k10_not_promoted\n' > C3AxiomAudit.lean
          lake env lean C3AxiomAudit.lean 2>&1 | tee C3AxiomAudit.log
          if grep -E 'sorryAx|Classical.choice|Quot.sound' C3AxiomAudit.log; then exit 1; fi
      - name: C3 exact-drop regression
        run: |
          printf 'import MCore.CircuitC3\nopen MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3\nexample : drop fixesZeroTrue reducibleExample = 3 := reducibleExample_drop_exact\nexample : drop leavesZeroFree oneInput = 0 := free_oneInput_drop_zero\n' > C3Drop.lean
          lake env lean C3Drop.lean
      - name: C3 universal-drop falsifier
        run: |
          printf 'import MCore.CircuitC3\nopen MCore.CircuitK1 MCore.CircuitC3\nexample : ¬ (∀ (ρ : Restriction) (c : Circuit), StrictDrop ρ c) := not_every_restriction_strictly_drops\n' > C3Falsifier.lean
          lake env lean C3Falsifier.lean
      - name: C3 epistemic non-promotion
        run: |
          printf 'import MCore.CircuitC3\nopen MCore MCore.CircuitC3\nexample : ¬ Nonempty (ProofCertificate k10_obligation_node) := c3_k10_not_promoted\n' > C3Epistemic.lean
          lake env lean C3Epistemic.lean
      - name: Clean C3 reproduction
        run: lake clean && lake build MCore.CircuitC3 && lake build MCore
