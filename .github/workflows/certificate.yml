name: certificate
on: [push, pull_request]
jobs:
  c10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: Preserve K-chain and C1-C9
        run: |
          lake build MCore.K3 MCore.K4 MCore.K5 MCore.K6 MCore.K7 MCore.K8 MCore.K9 MCore.K10 MCore.PrizeK0             MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC4 MCore.CircuitC5             MCore.CircuitC6 MCore.CircuitC7 MCore.CircuitC8             MCore.C9.Reuse MCore.C9.Vars MCore.C9.Mu MCore.C9.Good MCore.C9.Step
      - name: Build C10 restriction-progress bridge
        run: lake build MCore.C10.RestrictionProgress
      - name: Build umbrella target
        run: lake build MCore
      - name: C10 semantic axiom audit
        run: |
          set -euo pipefail
          cat > C10AxiomAudit.lean <<'EOF'
          import MCore.C10.RestrictionProgress
          #print axioms MCore.C10.stateRank_D_decreases_of_restriction_progress
          #print axioms MCore.C10.reducibleExample_restriction_progress
          #print axioms MCore.C10.reducibleExample_stateRank_decreases
          #print axioms MCore.C10.c10_classical_endpoint_not_promoted
          #print axioms MCore.C10.c10_k10_not_promoted
          EOF
          lake env lean C10AxiomAudit.lean 2>&1 | tee C10AxiomAudit.log
          if grep -E 'sorryAx' C10AxiomAudit.log; then exit 1; fi
          if grep -E 'depends on axioms:' C10AxiomAudit.log | grep -Ev '^.*\[(propext|Quot\.sound|Classical\.choice)(, (propext|Quot\.sound|Classical\.choice))*\]$'; then
            echo 'Unexpected axiom dependency outside trusted Lean set'; exit 1
          fi
      - name: C10 concrete restriction-progress regression
        run: |
          set -euo pipefail
          cat > C10Progress.lean <<'EOF'
          import MCore.C10.RestrictionProgress
          open MCore MCore.C9 MCore.C10 MCore.CircuitK1 MCore.CircuitC2
          example : RestrictionProgress fixesZeroTrue reducibleExample :=
            reducibleExample_restriction_progress
          example : stateRank (D fixesZeroTrue reducibleExample) < stateRank reducibleExample :=
            reducibleExample_stateRank_decreases
          EOF
          lake env lean C10Progress.lean
      - name: C10 open-obligation and non-promotion firewall
        run: |
          set -euo pipefail
          cat > C10Epistemic.lean <<'EOF'
          import MCore.C10.RestrictionProgress
          open MCore MCore.C10
          #check VarsNonincreaseObligation
          #check ProgressCoverageObligation
          example : ¬ Nonempty (ProofCertificate k10_obligation_node) := c10_k10_not_promoted
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := c10_classical_endpoint_not_promoted
          EOF
          lake env lean C10Epistemic.lean
      - name: Clean C10 reproduction
        run: lake clean && lake build MCore.C10.RestrictionProgress && lake build MCore
