name: certificate
on: [push, pull_request]
jobs:
  c11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: Preserve K-chain and C1-C10
        run: |
          lake build MCore.K3 MCore.K4 MCore.K5 MCore.K6 MCore.K7 MCore.K8 MCore.K9 MCore.K10 MCore.PrizeK0 \
            MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC4 MCore.CircuitC5 \
            MCore.CircuitC6 MCore.CircuitC7 MCore.CircuitC8 \
            MCore.C9.Reuse MCore.C9.Vars MCore.C9.Mu MCore.C9.Good MCore.C9.Step \
            MCore.C10.RestrictionProgress
      - name: Build C11 quantitative layer
        run: lake build MCore.C11.BranchingCost c11_regression
      - name: Build umbrella target
        run: lake build MCore
      - name: C11 semantic axiom audit
        run: |
          set -euo pipefail
          cat > C11AxiomAudit.lean <<'EOF'
          import MCore.C11.BranchingCost
          #print axioms MCore.C11.branchingCost_exact
          #print axioms MCore.C11.c11_classical_endpoint_not_promoted
          #print axioms MCore.C11.c11_k10_not_promoted
          EOF
          lake env lean C11AxiomAudit.lean 2>&1 | tee C11AxiomAudit.log
          if grep -E 'sorryAx' C11AxiomAudit.log; then exit 1; fi
          if grep -E 'depends on axioms:' C11AxiomAudit.log | grep -Ev '^.*\[(propext|Quot\.sound|Classical\.choice)(, (propext|Quot\.sound|Classical\.choice))*\]$'; then
            echo 'Unexpected axiom dependency outside trusted Lean set'; exit 1
          fi
      - name: C11 endpoint-language firewall
        run: |
          set -euo pipefail
          if grep -R -n -E 'P_ne_NP|P≠NP|P != NP|P = NP' lean/MCore/C11; then
            echo 'Classical endpoint language is forbidden inside C11'; exit 1
          fi
      - name: C11 deterministic branching-cost regression
        run: |
          set -euo pipefail
          lake exe c11_regression 2>&1 | tee C11Regression.log
          grep -q 'CASE=reducible_fix0_true' C11Regression.log
          grep -q 'CASE=one_input_free' C11Regression.log
          grep -q 'CASE=or_fix0_true' C11Regression.log
          grep -q 'CASE=or_fix1_false' C11Regression.log
          grep -q 'paysOff=true' C11Regression.log
          grep -q 'paysOff=false' C11Regression.log
      - name: C11 open-obligation and non-promotion firewall
        run: |
          set -euo pipefail
          cat > C11Epistemic.lean <<'EOF'
          import MCore.C11.BranchingCost
          open MCore MCore.C10 MCore.C11
          #check VarsNonincreaseObligation
          #check ProgressCoverageObligation
          #check UniversalPayoffObligation
          example : ¬ Nonempty (ProofCertificate k10_obligation_node) := c11_k10_not_promoted
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := c11_classical_endpoint_not_promoted
          EOF
          lake env lean C11Epistemic.lean
      - name: Clean C11 reproduction
        run: lake clean && lake build MCore.C11.BranchingCost c11_regression && lake exe c11_regression && lake build MCore
