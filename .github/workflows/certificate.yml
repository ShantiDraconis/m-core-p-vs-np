name: certificate
on: [push, pull_request]
jobs:
  c11:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - name: Resolve pinned dependencies
        run: |
          set -euo pipefail
          lake update
      - name: G0 fail-closed source hygiene
        run: |
          set -euo pipefail
          if grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
          if grep -R -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' --include='*.lean' lean; then exit 1; else rc=$?; [ "$rc" -eq 1 ] || exit "$rc"; fi
      - name: Preserve K-chain and C1-C10
        run: |
          lake build MCore.K3 MCore.K4 MCore.K5 MCore.K6 MCore.K7 MCore.K8 MCore.K9 MCore.K10 MCore.PrizeK0 \
            MCore.CircuitK1 MCore.CircuitC2 MCore.CircuitC3 MCore.CircuitC4 MCore.CircuitC5 \
            MCore.CircuitC6 MCore.CircuitC7 MCore.CircuitC8 \
            MCore.C9.Reuse MCore.C9.Vars MCore.C9.Mu MCore.C9.Good MCore.C9.Step \
            MCore.C10.RestrictionProgress
      - name: Build C11 variable-monotonicity bridge
        run: lake build MCore.C11.VarsMonotone
      - name: Build umbrella target
        run: lake build MCore
      - name: C11 semantic axiom audit
        run: |
          set -euo pipefail
          cat > C11AxiomAudit.lean <<'EOF'
          import MCore.C11.VarsMonotone
          #print axioms MCore.C11.eraseDups_loop_mem_nat
          #print axioms MCore.C11.eraseDups_loop_nodup_nat
          #print axioms MCore.C11.mem_eraseDups_nat
          #print axioms MCore.C11.eraseDups_nodup_nat
          #print axioms MCore.C11.nodup_length_le_of_subset_nat
          #print axioms MCore.C11.eraseDups_length_le_of_subset
          #print axioms MCore.C11.mem_freeVarList_restrict
          #print axioms MCore.C11.mem_freeVarList_simplify
          #print axioms MCore.C11.mem_freeVarList_D
          #print axioms MCore.C11.vars_D_le
          #print axioms MCore.C11.varsNonincrease_closed
          #print axioms MCore.C11.stateRank_D_decreases_of_strict
          #print axioms MCore.C11.c11_classical_endpoint_not_promoted
          #print axioms MCore.C11.c11_k10_not_promoted
          EOF
          lake env lean C11AxiomAudit.lean 2>&1 | tee C11AxiomAudit.log
          if grep -E 'sorryAx' C11AxiomAudit.log; then exit 1; fi
          if grep -E 'depends on axioms:' C11AxiomAudit.log | grep -Ev '^.*\[(propext|Quot\.sound|Classical\.choice)(, (propext|Quot\.sound|Classical\.choice))*\]$'; then
            echo 'Unexpected axiom dependency outside trusted Lean set'; exit 1
          fi
      - name: C11 eraseDups invariant regressions
        run: |
          set -euo pipefail
          cat > C11EraseDups.lean <<'EOF'
          import MCore.C11.VarsMonotone
          open MCore MCore.C11
          example : ([1,2,1,3,2] : List Nat).eraseDups.length = 3 := by native_decide
          example : ([1,2,1,3,2] : List Nat).eraseDups.Nodup := eraseDups_nodup_nat _
          example {l₁ l₂ : List Nat} (h : l₁ ⊆ l₂) :
              l₁.eraseDups.length ≤ l₂.eraseDups.length :=
            eraseDups_length_le_of_subset h
          EOF
          lake env lean C11EraseDups.lean
      - name: C11 variable monotonicity regressions
        run: |
          set -euo pipefail
          cat > C11Vars.lean <<'EOF'
          import MCore.C11.VarsMonotone
          open MCore MCore.C9 MCore.C10 MCore.C11 MCore.CircuitK1 MCore.CircuitC2
          example : VarsNonincreaseObligation := varsNonincrease_closed
          example (ρ : Restriction) (t : FormulaTree) : vars (D ρ t) ≤ vars t :=
            vars_D_le ρ t
          example : vars (Circuit.and (Circuit.input 0) (Circuit.input 0)) = 1 := by native_decide
          example : StrictRestrictionProgress fixesZeroTrue reducibleExample := by
            left
            native_decide
          example : stateRank (D fixesZeroTrue reducibleExample) < stateRank reducibleExample :=
            stateRank_D_decreases_of_strict fixesZeroTrue reducibleExample (by
              left
              native_decide)
          EOF
          lake env lean C11Vars.lean
      - name: C11 open-coverage and non-promotion firewall
        run: |
          set -euo pipefail
          cat > C11Epistemic.lean <<'EOF'
          import MCore.C11.VarsMonotone
          open MCore MCore.C10 MCore.C11
          #check ProgressCoverageObligation
          example : VarsNonincreaseObligation := varsNonincrease_closed
          example : ¬ Nonempty (ProofCertificate k10_obligation_node) := c11_k10_not_promoted
          example : ¬ Nonempty (ProofCertificate k6_dependency.target) := c11_classical_endpoint_not_promoted
          EOF
          lake env lean C11Epistemic.lean
      - name: Clean C11 reproduction
        run: lake clean && lake build MCore.C11.VarsMonotone && lake build MCore
