name: T1D construction-close worker
on:
  push:
    branches: [ attack/t1d-construction-close-20260922 ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t1d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - run: |
          set -euo pipefail
          f=lean/MCore/Real/P01ConstructionClose.lean
          test -f "$f"
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"
          lake build MCore.Real.P01ConstructionClose
          cat >/tmp/terminal.lean <<'EOF'
          import MCore.Real.P01ConstructionClose
          #check MCore.Real.P01ConstructionClose.p01_construction_closed
          #print axioms MCore.Real.P01ConstructionClose.p01_construction_closed
          EOF
          lake env lean /tmp/terminal.lean 2>&1 | tee /tmp/terminal.log
          if grep -q 'sorryAx' /tmp/terminal.log; then exit 1; fi
