name: P02 Unified Final Build

on:
  push:
    branches:
      - atk/p02-lane4-reuse-t10-audit-20261003
  workflow_dispatch:

concurrency:
  group: p02-unified-final-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unified-final-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Lean
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true

      - name: Build complete unified theory
        shell: bash
        run: |
          set -euo pipefail
          lake env lean lean/MCore/Real/P02UnifiedTheory.lean 2>&1 | tee P02UnifiedTheory.log
          if grep -E 'sorryAx|declaration uses .*sorry|unsolved goals' P02UnifiedTheory.log; then
            echo "Forbidden proof residue detected"
            exit 1
          fi

      - name: Unified certificate summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "P02_UNIFIED_THEORY=BUILT"
            echo "STRUCTURAL_STACK=RPA+LATTICE+CUBE14+TERMINAL"
            echo "COUNTERPROBE=CANDIDATE_CODE_SHORTCUT_BLOCKED"
            echo "MATERIAL_ENDPOINT=RejectImageEscape"
            echo "OPEN_BRIDGE_ACTIVE=0"
          } | tee P02UnifiedCertificate.txt

      - name: Upload unified evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p02-unified-theory-evidence
          path: |
            P02UnifiedTheory.log
            P02UnifiedCertificate.txt
