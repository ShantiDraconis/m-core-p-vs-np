name: T1D Global Physical

on:
  push:
    branches:
      - attack/t1d-global-physical-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-physical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Hygiene
        run: |
          set -euo pipefail
          f=lean/MCore/Real/P01T1DGlobalPhysical.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$f"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$f"
      - name: Build
        run: lake build MCore.Real.P01T1DGlobalPhysical
      - name: Status
        run: |
          echo "T1D_LOCAL_CONVERGENCE=GREEN"
          echo "T1D_GLOBAL_PHYSICAL=OPEN"
          echo "T1D_DECODER_EXISTENCE=OPEN"
