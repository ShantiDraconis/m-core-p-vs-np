name: ATK T5 universal failure algebra

on:
  push:
    branches:
      - attack/t5-a2-universal-existence-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  t5-a2-algebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Hygiene
        run: |
          set -euo pipefail
          file=lean/MCore/Real/P02UniversalFailureAlgebra.lean
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"; then exit 1; fi
          if grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$file"; then exit 1; fi

      - name: Build normalized universal failure algebra
        run: lake build MCore.Real.P02UniversalFailureAlgebra

      - name: Axiom audit
        run: |
          cat >/tmp/T5A2UniversalFailureAudit.lean <<'EOF'
          import MCore.Real.P02UniversalFailureAlgebra
          #print axioms MCore.Real.P02UniversalFailureAlgebra.not_correctAt_iff_clock_or_semantic_mismatch
          #print axioms MCore.Real.P02UniversalFailureAlgebra.g21_iff_totality_or_semantic_counterexample
          #print axioms MCore.Real.P02UniversalFailureAlgebra.self_embed_witness_gives_semanticMismatch
          #print axioms MCore.Real.P02UniversalFailureAlgebra.totality_or_semantic_closes_p02
          EOF
          lake env lean /tmp/T5A2UniversalFailureAudit.lean 2>&1 | tee /tmp/t5-a2-universal-failure-audit.log
          if grep -q 'sorryAx' /tmp/t5-a2-universal-failure-audit.log; then exit 1; fi

      - name: Fail closed status
        run: |
          echo "T5_A2_NORMAL_FORM=BUILDABLE"
          echo "T5_A2_EXISTENCE=OPEN_MATH"
