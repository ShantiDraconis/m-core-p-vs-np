name: ATK canonical final external
on:
  push:
    branches: [atk/auto-compose-terminal-20260930]
    paths:
      - 'lean/MCore/Real/CanonicalFinalExternal.lean'
      - 'lean/MCore/Real/P02TerminalFrontier.lean'
      - 'lean/MCore/Real/P02G21G22Attack.lean'
      - '.github/workflows/atk-canonical-final-external.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: lake update
      - name: Build canonical FINAL_EXTERNAL
        run: lake build MCore.Real.CanonicalFinalExternal
