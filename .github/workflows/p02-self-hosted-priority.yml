name: P02 Self Hosted G2

on:
  workflow_dispatch:
  push:
    branches:
      - atk/p02-g2-universal-failure-material-20261005
    paths:
      - 'lean/MCore/Real/P02UniversalFailureWitnessMaterial.lean'
      - 'scripts/runner/**'
      - '.github/workflows/p02-self-hosted-priority.yml'

jobs:
  kernel:
    runs-on: [self-hosted, linux, x64, p02, lean419, mcore]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Runner health
        run: bash scripts/runner/health-p02-runner.sh
      - name: Build and audit G2 material witness
        run: bash scripts/runner/run-p02-dual-kernel.sh
