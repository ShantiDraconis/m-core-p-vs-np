name: P02 Hosted Equality Composition

on:
  workflow_dispatch:
  push:
    branches:
      - atk/p02-equality-material-atoms-20261005
    paths:
      - 'lean/MCore/Real/P02SequentialCompositionMachine.lean'
      - 'scripts/runner/**'
      - '.github/workflows/p02-self-hosted-priority.yml'

jobs:
  kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean toolchain
        shell: bash
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Runner health
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/runner/health-p02-runner.sh
      - name: Build and audit equality composition
        shell: bash
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/runner/run-p02-dual-kernel.sh
