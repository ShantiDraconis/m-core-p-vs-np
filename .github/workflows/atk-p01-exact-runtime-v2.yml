name: atk-p01-exact-consumption

on:
  push:
    branches:
      - atk/p01-exact-runtime-v2-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-consumption:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        run: |
          curl https://elan.lean-lang.org/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          $HOME/.elan/bin/elan toolchain install "$(cat lean-toolchain)"
      - name: Resolve dependencies
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake update
      - name: Source firewall
        run: |
          set -euo pipefail
          FILE=lean/MCore/Real/P01CheckedEvalRunExactCertificate.lean
          ! grep -n -E '(^|[^[:alnum:]_])(sorry|admit|sorryAx|unsafe|cheat|bypass|placeholder)([^[:alnum:]_]|$)' "$FILE"
          ! grep -n -E '^[[:space:]]*(@\[[^]]*\][[:space:]]*)?(axiom|constant|constants)[[:space:]]' "$FILE"
      - name: Build exact consumption certificate
        run: lake build MCore.Real.P01CheckedEvalRunExactCertificate
      - name: Axiom audit
        run: |
          cat > P01ExactConsumptionAxioms.lean <<'EOF'
          import MCore.Real.P01CheckedEvalRunExactCertificate
          #print axioms MCore.Real.P01CheckedEvalRunExactCertificate.input_consumed_exact
          #print axioms MCore.Real.P01CheckedEvalRunExactCertificate.input_exact_bounded_certificate
          #print axioms MCore.Real.P01CheckedEvalRunExactCertificate.exact_to_bounded
          EOF
          lake env lean P01ExactConsumptionAxioms.lean | tee p01-exact-consumption-axioms.txt
          ! grep -E 'sorryAx' p01-exact-consumption-axioms.txt
