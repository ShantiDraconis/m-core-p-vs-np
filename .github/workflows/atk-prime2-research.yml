name: ATK Prime2 research transfer

on:
  push:
    branches:
      - atk/t1-d-terminal-construction-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build Prime2 research route
        run: |
          set -euo pipefail
          lake build MCore.Research.Prime2ConservativeTransfer
          lake build MCore.Research.Prime2FractionalHorizon
          lake build MCore.Research.PatternCalculator
      - name: Hygiene
        run: |
          set -euo pipefail
          files=(lean/MCore/Research/Prime2ConservativeTransfer.lean lean/MCore/Research/Prime2FractionalHorizon.lean lean/MCore/Research/PatternCalculator.lean)
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "${files[@]}"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "${files[@]}"
      - name: Collect research evidence
        run: |
          python3 research/evidence/collect_run_evidence.py
      - name: Auto-formalize discovered patterns
        run: |
          set -euo pipefail
          python3 research/patterns/auto_formalize.py
          if find lean/MCore/Research/Generated -name '*.lean' -print -quit | grep -q .; then
            ! grep -RInE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' lean/MCore/Research/Generated
            ! grep -RInE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' lean/MCore/Research/Generated
            while IFS= read -r file; do
              lake env lean "$file"
            done < <(find lean/MCore/Research/Generated -name '*.lean' -type f | sort)
          fi
      - name: Upload research evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-proof-research-evidence-${{ github.run_id }}
          path: |
            research/evidence/generated/run-evidence.json
            research/patterns/registry.json
            research/patterns/open/
            lean/MCore/Research/Generated/
      - name: Fail-closed boundary
        run: |
          echo "PRIME2_ROUTE=RESEARCH_ONLY"
          echo "PROOF_CREDIT=0"
          echo "PROMOTION_REQUIRES=ConservativePrime2Interpretation+MappedPrime2UniversalFailure"
          echo "TARGET=G21Pointwise"
