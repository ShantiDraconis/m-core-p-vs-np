name: ATK Prime2 research transfer

on:
  push:
    branches:
      - atk/t1-d-terminal-construction-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false
      - name: Build Prime2 research route
        run: |
          set -euo pipefail
          lake build MCore.Research.Prime2ConservativeTransfer
      - name: Hygiene
        run: |
          set -euo pipefail
          file=lean/MCore/Research/Prime2ConservativeTransfer.lean
          ! grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' "$file"
          ! grep -nE '^[[:space:]]*(axiom|constant|constants)[[:space:]]' "$file"
      - name: Fail-closed boundary
        run: |
          echo "PRIME2_ROUTE=RESEARCH_ONLY"
          echo "PROOF_CREDIT=0"
          echo "PROMOTION_REQUIRES=ConservativePrime2Interpretation+MappedPrime2UniversalFailure"
          echo "TARGET=G21Pointwise"
