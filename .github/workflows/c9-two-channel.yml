name: c9-two-channel
on:
  push:
    branches: [work/C9-two-channel-bridge]
  pull_request:
jobs:
  bridge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
      - run: lake update
      - name: Hygiene
        run: |
          set -euo pipefail
          ! grep -R -n -E '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' --include='*.lean' lean/MCore/C9
          ! grep -R -n -E '^[[:space:]]*(axiom|constant|constants)[[:space:]]' --include='*.lean' lean/MCore/C9
      - name: Build two-channel core
        run: lake build MCore.C9.FreeVars MCore.C9.Good0 MCore.C9.Progress
      - name: Regression theorem
        run: |
          cat > C9BridgeAudit.lean <<'EOF'
          import MCore.C9.Progress
          open MCore MCore.C9
          #print axioms MCore.C9.vars_D_le
          #print axioms MCore.C9.fixed_not_mem_D
          #print axioms MCore.C9.good0_vars_strict
          #print axioms MCore.C9.good0_deltaN_pos
          #print axioms MCore.C9.good0_two_channel_progress
          #print axioms MCore.C9.single_channel_counterexample
          EOF
          lake env lean C9BridgeAudit.lean 2>&1 | tee C9BridgeAudit.log
          ! grep -E 'sorryAx' C9BridgeAudit.log
      - name: Preserve prior C9
        run: lake build MCore.C9.Good
