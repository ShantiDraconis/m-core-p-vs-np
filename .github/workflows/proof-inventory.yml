name: Proof inventory

# Kernel-derived registry: builds every module of the Lean library (not only
# the modules the root file imports), records each theorem's axioms, flags
# vacuous Prop definitions and derives PROVED / REFUTED status from the kernel.
# Fails on sorryAx, on project-declared axioms used by a theorem, and on a
# broken library module or executable audit file. Archival concatenations are listed separately.

on:
  push:
    paths:
      - '**/*.lean'
      - 'audit/**'
      - 'lakefile.*'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'scripts/proof_inventory.py'
      - '.github/workflows/proof-inventory.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean via Elan
        shell: bash
        run: |
          set -euo pipefail
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Kernel-derived proof inventory
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          extra=""
          # pull requests must ship a regenerated inventory; pushes only warn
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then extra="--fail-if-stale"; fi
          python3 scripts/proof_inventory.py --out inventory --strict --check-committed $extra
      - name: Verify material probe diagnostics
        run: |
          lake env lean probe/P01MachineConstructionExpectedFailure.lean
          lake env lean probe/PNPMaterialExpectedFailure.lean
      - name: Upload inventory
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proof-inventory
          path: inventory/
          if-no-files-found: warn
